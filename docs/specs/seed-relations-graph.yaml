goal:
  statement: >-
    build-spec Seed 사이의 부모-자식·형제 선후 관계와, 자식 Seed가 풀어쓰는 부모의 constraint-N/acceptance-N 항목을
    Seed 파일에 기계가 읽을 수 있게 기록해서, Seed 하나가 끝났을 때 다음 Seed를 손으로 다시
    찾지 않고 트리 스크립트와 next-goal 후보로 바로 찾게 한다.
  clarity_score: 0.9

constraints:
  - id: constraint-1
    type: technical
    description: >-
      relations 어디에도 상태·진척·완료 값을 두지 않는다. Seed가 끝났는지, 부모의 acceptance/constraint 항목이
      채워졌는지는 지금처럼 next-goal이 레포 상태를 보고 판정한다.
    hard: true
    rationale: >-
      템플릿 amendment contract가 Seed를 작업 로그가 아닌 스펙으로 규정하고, next-goal도
      "not met yet is a judgment about the repository"라고 명시한다. 엣지에 done을 붙이면
      레포와 어긋나는 두 번째 진실 원천이 생긴다.
  - id: constraint-2
    type: technical
    description: >-
      v2/v3 관계는 명시한 정확한 파일 경로를 따른다. 생애주기와 관계 버전이 없는 구형 관계만
      최신 `-vN` 호환 해석을 사용하며, 명시적 생애주기가 있는 대상이나 종료 기록은 자동으로 이동하지 않는다.
    hard: true
    rationale: >-
      새 세대 작성만으로 승인된 관계나 종료 기록의 대상이 바뀌는 것을 막는다.
  - id: constraint-3
    type: technical
    description: >-
      amendment contract 헤더에 id 불변 규칙을 넣는다. 기존 constraint-N/acceptance-N id는 재사용하거나
      삭제하지 않고, 새 항목은 새 id로 뒤에 붙인다. 가드가 편집 전후의 constraint-N/acceptance-N id 목록을
      비교해 사라진 id가 있으면 편집을 막고, 일치 검사 스크립트는 가리키는 항목이 없는
      refines를 보고한다.
    hard: true
    rationale: >-
      refines가 부모 항목 id를 가리키는데 지금은 id가 안 바뀐다는 보장이 없다. 기존 refine
      사례에서 id가 유지된 건 규칙 덕이 아니라 우연이다. 선언만 두면 강제하는 곳이 없어서
      강제 수단까지 같이 둔다.
  - id: constraint-4
    type: technical
    description: >-
      엣지는 양방향이다. 자식은 `relations.parent`·`relations.refines`·`relations.depends_on`을,
      부모는 `relations.children`을 가진다. 양쪽이 맞는지는 결정론 스크립트가 검사한다.
    hard: true
    rationale: >-
      부모와 자식이 다른 레포에 있을 수 있어서, 자식 쪽 엣지만으로는 다른 레포의 형제를 찾을 수
      없다. 부모 → 자식 역산은 남의 레포 docs/specs/까지 훑어야 가능하기 때문이다.
  - id: constraint-5
    type: technical
    description: >-
      같은 레포 엣지는 레포 루트 기준 상대경로로, 다른 레포 엣지는
      `owner/repo:docs/specs/x.yaml` 좌표로 적는다. 다른 레포 Seed는 `gh api`로 읽기만 한다.
    hard: true
    rationale: 로컬 경로는 머신마다 달라서 깨진다. GitHub 좌표는 어느 머신에서나 같은 값이다.
  - id: constraint-6
    type: technical
    description: >-
      레포를 넘어서는 쓰지 않는다. 다른 레포 부모의 children에 자식이 빠져 있으면 일치 검사
      스크립트가 보고하고, 부모 레포에서 세션을 열었을 때 추가한다. 같은 레포면 build-spec이
      양쪽을 바로 쓴다. 다른 레포 Seed의 완료 판정도 그 레포 세션만 하고, 여기서는 "다음 후보가
      거기 있다"는 링크로만 보여준다.
    hard: true
    rationale: >-
      next-goal이 다른 레포 Seed를 읽지 않는 이유가 판정 근거가 그 레포 코드에 있기 때문이다.
      쓰기도 판정과 같은 원칙으로 자기 레포에서만 해야 다른 레포 작업 트리를 건드리지 않는다.
  - id: constraint-7
    type: technical
    description: >-
      next-goal의 "never glob a spec directory to find one" 규칙을 "이름을 댄 Seed에서 명시적
      엣지로 도달하는 Seed도 in play"로 좁혀 연다. 탐색은 LLM 없이 도는 결정론 스크립트가 하고,
      이름을 댄 기준 Seed 없이는 실행되지 않는다.
    hard: true
    rationale: >-
      그 규칙이 막으려는 건 상관없는 옛 Seed가 후보에 끼는 것이다. 명시적 엣지로 이어진 Seed는
      상관없는 Seed가 아니다. 다만 기준 Seed 없이 돌 수 있으면 원래 막던 디렉토리 훑기와 같아진다.
  - id: constraint-8
    type: technical
    description: >-
      #767이 먼저 seed-append-check.py의 판정을 "템플릿이 그 위치에 정의한 키만 통과"로 좁혔고,
      여기서는 템플릿에 relations만 추가한다. 최상위든 항목 안이든 같은 규칙이라, 템플릿에 들어간
      `relations:`는 통과하고 `status:`는 어느 깊이에서도 막힌다.
    hard: true
    rationale: >-
      가드는 템플릿에 없는 키를 새로 넣는 편집을 막는다. 그래서 relations는 템플릿 정의(constraint-9)가
      먼저 들어가야 Seed에 쓸 수 있고, 가드 코드는 따로 고칠 필요가 없다.
  - id: constraint-9
    type: technical
    description: templates/SEED_SPEC.yaml이 relations 필드(parent, refines, depends_on, children)를 정의한다.
    hard: true
    rationale: >-
      템플릿에 없으면 constraint-8의 "템플릿이 정의한 키" 판정이 relations를 막고, 리뷰와 다른 도구도
      정식 필드로 인식하지 못한다.
  - id: constraint-10
    type: technical
    description: >-
      build-spec Phase 0이 관련된 기존 Seed를 한 번 묻고, 메타데이터를 확인한 같은 레포 후보를
      최대 세 개 제시한다. 다른 경로·레포는 사용자가 직접 지정한다. 연결은 자식·선행·참조로 구분한다.
    hard: true
    rationale: >-
      작성하는 동안 연결해야 나중에 손으로 잇는 일이 안 생긴다. 사람이 고르는 목록이라
      constraint-7이 막는 무분별한 탐색과는 다르다.
  - id: constraint-11
    type: technical
    description: >-
      같은 레포의 미완료 선행을 기다리는 후보는 next-goal에서 held로 둔다. 외부 선행은
      미확인으로 표시하고 이에 의존하는 후보를 보류한다.
    hard: true
    rationale: 다른 레포 선행의 미확인을 완료 또는 실패로 추정하지 않는다.
  - id: constraint-12
    type: technical
    description: >-
      Refine으로 새 세대를 만들 때 기존 관계의 출처를 보존한다. 기존 자식을 자동으로 옮기지 않고,
      실제 관계 변경은 명시적 승인 후 양쪽 파일을 검증한다.
    hard: true
    rationale: >-
      이전 연결의 근거를 보존하면서 기존 자식이 새 세대로 무단 이관되는 것을 막는다.

success_criteria:
  - id: acceptance-1
    description: 이름을 댄 Seed 하나를 주면 트리 스크립트가 부모·형제·자식과 refines 대응을 출력한다.
    verifiable: true
    measurable_via: 같은 레포 부모 1개 + 자식 2개 픽스처에서 스크립트 출력 대조 테스트
  - id: acceptance-2
    description: >-
      next-goal이 끝난 자식 Seed를 이름으로 받으면, 같은 스크립트를 불러서 부모의 아직 안 채워진
      ac/c와 형제 Seed를 후보에 올린다.
    verifiable: true
    measurable_via: next-goal SKILL.md의 Seed 풀 절이 스크립트 호출을 명시하는지 + 스크립트의 후보 출력 픽스처 테스트
  - id: acceptance-3
    description: 부모의 새 세대가 있어도 명시적 v2/v3 관계는 원래 파일을 가리키고, 구형 관계만 최신 세대 호환 해석을 따른다.
    verifiable: true
    measurable_via: foo.yaml과 foo-v2.yaml이 둘 다 있는 픽스처 테스트
  - id: acceptance-4
    description: >-
      일치 검사가 두 방향의 불일치를 모두 보고한다. 자식이 가리키는데 부모 children에 없는 경우와,
      부모 children에 있는데 자식이 되가리키지 않는 경우다. 다른 레포 부모가 빠진 경우는
      "부모 레포에서 추가 필요"로 보고한다.
    verifiable: true
    measurable_via: 불일치 3종 픽스처 테스트
  - id: acceptance-5
    description: >-
      seed-append-check.py 자체 테스트에서 최상위 `status:` 추가와 constraint 항목 안에 들여쓴
      `status:` 추가가 둘 다 막히고, 템플릿이 정의한 `relations:` 추가는 통과한다.
    verifiable: true
    measurable_via: seed-append-check.py 자체 테스트 케이스 3종
  - id: acceptance-6
    description: 다른 레포 Seed를 `gh api`로 읽다가 실패하면 명시적인 실패 줄을 출력하고, 빈 결과로 보이지 않는다.
    verifiable: true
    measurable_via: gh 실패를 흉내 낸 테스트에서 실패 줄 출력 확인
  - id: acceptance-7
    description: >-
      같은 레포의 미완료 선행은 의존 후보를 보류하고, 외부 선행은 미확인 사유와 함께 의존 후보를 보류한다.
    verifiable: true
    measurable_via: depends_on 같은 레포·다른 레포 픽스처 테스트
  - id: acceptance-8
    description: >-
      편집으로 기존 constraint-N/acceptance-N id가 사라지면 가드가 막고, 가리키는 항목이 없는 refines는 일치 검사가
      보고한다.
    verifiable: true
    measurable_via: id 삭제 편집 거부 테스트 + 없는 id를 가리키는 refines 픽스처 테스트
  - id: acceptance-9
    description: 템플릿이 relations 필드를 정의하고, amendment contract 헤더에 id 불변 규칙이 있다.
    verifiable: true
    measurable_via: templates/SEED_SPEC.yaml 직접 확인
  - id: acceptance-10
    description: >-
      Phase 0에서 관련 Seed를 확인한 뒤 자식·선행·참조를 구분한다. Refine 새 세대에서 기존 자식은
      자동으로 이동하지 않으며, 승인된 관계 변경은 양쪽 파일에서 일치한다.
    verifiable: true
    measurable_via: build-spec의 관계 분기 확인과 Refine 전후 양쪽 Seed의 관계 비교

