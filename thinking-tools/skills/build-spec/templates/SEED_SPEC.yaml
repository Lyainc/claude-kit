# Seed Spec — output template
# Generated by: thinking-tools/build-spec
# Usage: copy this template; fill in fields during Phase 3 Seed Emit.
#
# AMENDMENT CONTRACT — keep these lines in the emitted file.
# This is a functional spec, not a work log. When reality changes, REPLACE the affected
# field's value. Never append progress notes, dated corrections, round records, review
# findings, or implementation status to it: git history and the issue timeline already
# carry those, and a spec carrying both stops being readable as a spec.
# Keys: only the fields this template defines — no status/progress field. Claude Code's
# seed-append-guard hook denies any other new key; on Codex no hook runs, so this contract
# is the only enforcement.
# Ids: a constraint-N/acceptance-N id is never reused or deleted — a dropped requirement keeps its
# id and its entry is rewritten, a new one takes the next unused number. Other Seeds' `refines`
# point at them. Legacy c<N>/ac<N> ids are renamed only via scripts/seed-id-migrate.py; the
# convention is defined in reference/identifiers.md.
---
# Output conforms to thinking-tools/reference/common-schema.md
skill: build-spec
schema_version: 1
version: <skill-version>
generated: <ISO-date>
input:
  target: <idea/project name>
  options: []
output:
  type: spec
  structure: templates/SEED_SPEC.yaml

# build-spec extensions
spec_version: 1
created: <ISO-date>
target: <idea/project name>
domain: <tech|biz|creative|custom>
brownfield: <true|false>
refine_generation: <0 if first run, N if refining ("이 스펙 다듬어줘")>

goal:
  statement: <single-sentence goal — what changes for whom>
  clarity_score: <0.0-1.0>

constraints:
  - id: constraint-1
    type: technical|resource|legal|temporal|other
    description: <constraint description>
    hard: <true|false>
    rationale: <why this constraint exists>
  # add more: constraint-2, constraint-3, ...

success_criteria:
  - id: acceptance-1
    description: <observable outcome>
    verifiable: <true|false>
    measurable_via: <metric, test, or observation method>
  # add more: acceptance-2, acceptance-3, ...

context:
  existing_stack: []    # brownfield only — list of relevant tech/systems
  dependencies: []      # brownfield only — external deps that constrain design
  integration_points: [] # brownfield only — API endpoints, modules, tables affected
  backlog_scan: <brownfield only — Phase 0 open-issue scan verdict: conflicting "#N — what conflicts"
                 entries, or an explicit no-conflict statement. null only when gh/GitHub was unavailable>

issues:               # GitHub issues tied to this Seed — references only, never a status (seed-relations-graph/constraint-1)
  source: null        # the issue this Seed was created from: "#N" (same repo) or "owner/repo#N"; null = not recorded
  tracking: []        # issues that implement this Seed (same notation) — kept distinct from source

relations:            # edges to other Seeds — never a status/progress value (seed-relations-graph/constraint-1)
  parent: null        # parent Seed, or null. Same repo: repo-root relative path; other repo: owner/repo:docs/specs/x.yaml
  refines: []         # parent item ids this Seed spells out, e.g. [constraint-3, acceptance-2]
  link_reason: null   # why this Seed hangs off the parent: what the refined items leave open; with a parent and empty refines, why no parent item maps. null = not recorded — shown as 미확인, never guessed
  depends_on: []      # sibling Seeds that must be finished before this one (same path/coordinate rules)
  children: []        # child Seeds (the parent side of each child's `parent` edge)

blindspots: []   # Phase 2.5 findings the user kept — each: {area, question}. [] when none kept or the pass was skipped

ambiguity:
  overall: <0.0-1.0>   # lower is better; gate threshold = 0.20
  gate_passed: <true|false>

clarity_breakdown:    # per-dimension CLARITY score (higher = clearer); inverse of ambiguity
  goal: <0.0-1.0>
  constraint: <0.0-1.0>
  success: <0.0-1.0>
  context: <0.0-1.0 or null>

metadata:
  interview_rounds: <count>
  questions_asked: <count>
  generated_by: thinking-tools/build-spec
  source_session: <optional — session ID or description>
---
