# Discovery Report였기 때문 (build-spec/SKILL.md Phase 2.5 "Skip condition — UD handoff").
blindspot_pass: skipped   # reason: already covered by prior unknown-discovery pass

blindspots:
  - area: edge-case
    question: >-
      c5의 mtime 캐시(대상 파일 mtime 무변 시 해시 재계산 스킵)는, git checkout처럼
      mtime은 그대로인데 내용이 바뀌는 경로에서 오래된 결과를 재사용해 드리프트가
      있어도 침묵하지 않는가? c3("침묵 = 깨끗한 상태") 신뢰를 깨는 시나리오다.
    note: >-
      unknown-discovery Quick Discovery 인터뷰에서 확인됨(작성자: "몰랐다/놓쳤다").
      대응 방향(checkout류 캐시 무효화 규칙 추가 vs 알려진 리스크로 감수)은 이번
      refine에서 미결정 — blindspots로만 유지하기로 확인.
  - area: blindspot
    question: >-
      local-harness 레포가 없는 머신에서 훅이 "조용히 no-op"하는데, 이 침묵이
      c3이 보장하는 "드리프트 없음" 침묵과 신호가 같다. 사용자가 "애초에 안 돌았다"와
      "돌았고 깨끗했다"를 구분할 방법이 있는가?
    note: >-
      unknown-discovery 인터뷰에서 별개 finding으로 분리 확인. 구분 신호 설계는
      이번 refine에서 다루지 않고 blindspots로 유지.
  - area: dependency
    question: >-
      c2(해시 대조 판정)는 "각 도구 패키지의 템플릿 원본"이 항상 조회 가능하다고
      전제한다. uv/pip처럼 패키지 매니저가 있는 도구는 매니저 캐시에서 직접
      읽으면 되지만, graphify git pre-commit 훅처럼 매니저 없이 파일로만 존재하는
      대상은 원본을 어디서 가져올지 전략이 없다. 하드코딩은 c6과 충돌한다.
    note: >-
      unknown-discovery 인터뷰에서 처음 드러남(작성자: "아직 결정 안 됨, 이제
      알게 된 거야"). 비-패키지매니저 원본 발견 전략은 별도 설계 필요 — blindspots 유지.

