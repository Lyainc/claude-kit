goal:
  statement: >-
    이 Seed는 #593에서 폐기한 code-reviewer 에이전트 설계를 참조 기록으로 유지하고 재등록하지 않는다.
    현재 요구사항 갭 리뷰는 requirement-gap-reviewer가 소유하며, 승인된 현재 Seed의
    constraints·success_criteria 대조만 seed-diff-grading.md 특수화로 전달한다.
    폐기된 baseline 3항목·HIGH/BLOCK 게이트를 현재 리뷰 계약으로 되살리지 않는다.
  clarity_score: 0.9

constraints:
  - id: constraint-1
    type: technical
    description: >-
      현재 요구사항 대조는 기존 requirement-gap-reviewer의 읽기 전용 단일 리뷰에서 수행한다.
      이 Seed를 근거로 code-reviewer 에이전트나 별도 fan-out 경로를 추가하지 않는다.
    hard: true
    rationale: >-
      #593의 에이전트 제거와 #706의 방법론 이관 이후 별도 저비용 code-reviewer 경로는 소유자가 아니다.

  - id: constraint-2
    type: technical
    description: >-
      현재 격리 리뷰 실행자는 requirement-gap-reviewer다. 호출자가 요구 출처와 base ref 또는
      diff range를 명시한다. Seed가 있으면 본문 전에 metadata와 생애주기·eligibility를
      확인하고, 현재 승인 범위 밖 unknown/paused/closed·철회·검토 보류 항목은 채점하지 않는다.
    hard: true
    rationale: "#134의 \"격리 critique·self-approval 금지\" 불변조건을 따른다."

  - id: constraint-3
    type: other
    description: >-
      리뷰어는 읽기 전용으로 보고만 한다. 실제 코드 수정·git 상태 변경은 하지 않으며
      메인 컨텍스트가 보고된 요구 갭을 처리한다. 발견마다 해결 방향 2–3개를 강제하지 않는다.
    hard: true
    rationale: >-
      구체 해결은 세션 맥락을 가진 메인 컨텍스트가 소화해야 한다. 격리 에이전트는 diff와
      Seed만 보고 세션의 나머지 맥락을 모르므로, 패치를 내면 맥락 없는 수정이 된다.

  - id: constraint-4
    type: other
    description: >-
      OMC code-reviewer agentType도 폐기된 thinking-tools:code-reviewer도 부활하거나
      호환 대상으로 삼지 않는다. 현재 requirement-gap-reviewer의 요구사항 대조 계약을 따른다.
    hard: true
    rationale: "#268에서 그 계약을 부활이 아니라 네이티브 재배선으로 해소하기로 결정했다."

  - id: constraint-5
    type: other
    description: >-
      타 레포 OMC 잔재 정리·리뷰 배선 신설·기능 구현은 이 Seed 갱신 범위 밖이다.
      역사적 Seed를 읽었다는 이유로 그 작업을 재개하지 않는다.
    hard: true
    rationale: >-
      폐기된 에이전트 설계 기록은 다른 레포 수정이나 새로운 실행 경로를 승인하지 않는다.

  - id: constraint-6
    type: technical
    description: >-
      Claude requirement-gap-reviewer 정의는 model: sonnet·effort: high를 명시한다.
      Codex에서는 codex-portability.md에 따라 실제 사용 가능한 native subagent 도구·모델을
      쓰며 Claude 모델 별칭이나 에이전트 타입을 Codex 기능으로 가정하지 않는다.
    hard: true
    rationale: >-
      모델·도구 선언은 현존 에이전트와 실행 런타임의 소관이다. 폐기된 code-reviewer의 고정값을 이식하지 않는다.

  - id: constraint-7
    type: technical
    description: >-
      이 Seed로 훅·CI·프리푸시 배선을 만들지 않는다. 현재 리뷰는 blocking/should-fix/nit
      심각도를 보고하고, 채점 결과가 실제로 미충족인 요구에 대해서만 완료 여부를 판단한다.
      HIGH/BLOCK/PASS는 폐기된 에이전트의 출력 계약이다.
    hard: true
    rationale: 배선은 별도 스코프다. #134의 프리푸시 게이트 설계·구현은 이 이슈가 대신하지 않는다.

  - id: constraint-8
    type: other
    description: >-
      폐기 설계의 고정 baseline 3항목(입력 검증·데이터 손실 에러 처리·실행 체크 부재)은
      현재 requirement-gap-reviewer의 체크리스트가 아니다. 그 에이전트는 명시된 세션 요구·
      이슈·완료 조건·승인 Seed의 갭만 채점하며, 일반 정확성·저장소 규칙 검사는 native 리뷰 축이다.
    hard: true
    rationale: >-
      #728의 소유권 경계는 요구사항 출처가 없는 결함을 요구 갭으로 발명하는 중복 리뷰를 막는다.

  - id: constraint-9
    type: technical
    description: >-
      호출자가 base ref도 diff range도 주지 않으면 `중단 — 범위 미지정`, 요구 출처를
      확립하지 못하면 `중단 — 요구 출처 미확립`으로 멈춘다. 읽지 못한 변경·실패한 호출을
      깨끗한 PASS로 취급하지 않는다. 대용량 변경의 범위 축소는 호출자가 결정한다.
    hard: true
    rationale: >-
      리뷰어가 기준 branch를 추정하거나 미확인 부분을 통과로 취급하면 기존 결함과 이번 변경의 요구 갭이 섞인다.

  - id: constraint-10
    type: other
    description: >-
      현재 승인 범위의 success_criteria를 requirement-gap-reviewer §2 단일 어휘인
      충족 / 미충족 / 산출물로 판단 불가로 판정한다. 실행 결과가 필요한 마지막 상태는
      무엇을 실행해야 판단할 수 있는지 보고하되 blocking으로 승격하지 않는다.
    hard: true
    rationale: >-
      실행·프로세스성 기준(스크립트 통과, 스모크 결과)은 diff만 보고 확인할 수 없다.
      2상태면 미실행 기준을 미충족으로 잘못 차단하거나 조용히 무시할 수 있어
      현재 방법론도 판단 불가 상태를 구별한다.

  - id: constraint-11
    type: other
    description: >-
      현재 심각도는 blocking(명시 요구 미충족·hard 제약 위반), should-fix(요구 축의
      불일치), nit(취향)이다. 일반 정확성 결함을 요구 갭으로 중복 보고하지 않고, base에
      이미 있던 결함은 별도 기존 결함 섹션에 심각도 없이 둔다. 폐기된 HIGH/MED/LOW 규칙은 적용하지 않는다.
    hard: true
    rationale: >-
      requirement-gap-reviewer §2–4가 판정·심각도·기존 결함 분리를 소유하고 Seed 특수화는 그 이름을 빌린다.

  - id: constraint-12
    type: other
    description: >-
      최종 메시지는 한국어 요구 출처·판정 표·severity가 있는 Findings·기존 결함 보고다.
      발견이 0건이면 `요구 출처 <X> 기준 갭 없음`을 명시하며, 중단은 해당 중단 제목과
      이유를 반환한다. content-free sign-off나 파일 경로만 반환하지 않는다.
      Seed 특수화는 seed-diff-grading.md를 덧붙이고 별도 HIGH 카운트/BLOCK/PASS 형식을 신설하지 않는다.
    hard: true
    rationale: >-
      현존 reviewer의 Report format과 Final Response Contract가 반환 형식을 소유한다.

success_criteria:
  - id: acceptance-1
    description: >-
      현존 requirement-gap-reviewer의 tools/effort·최종 반환 계약이 검사를 통과하고
      code-reviewer.md는 에이전트 목록에 다시 생기지 않는다.
    verifiable: true
    measurable_via: >-
      uv run --no-project scripts/check-agent-tools-field.py 및 check-agent-tools-usage.py,
      현존 agents 목록·requirement-gap-reviewer Final Response Contract 대조

  - id: acceptance-2
    description: check-version-sync.py를 통과한다.
    verifiable: true
    measurable_via: >-
      uv run --no-project scripts/check-version-sync.py 및 Claude keywords에서
      requirement-gap-reviewer 등록·code-reviewer 미등록 확인

  - id: acceptance-3
    description: >-
      현재 요구 출처·base가 명시된 diff에 그 요구의 위반을 넣으면 blocking finding이
      한국어 보고에 나온다. baseline 데이터 손실이라는 이유만으로 요구 갭을 만들어내지 않는다.
    verifiable: true
    measurable_via: >-
      requirement-gap-reviewer 실제 호출에서 승인된 Seed hard 제약 또는 명시 요구 위반 입력과 결과 비교

  - id: acceptance-4
    description: >-
      현재 승인 요구를 충족하는 diff는 충족으로 판정하며, findings 0건이면
      요구 출처를 이름으로 쓴 `기준 갭 없음`을 반환한다. PASS 한 줄이 현재 출력 계약은 아니다.
    verifiable: true
    measurable_via: >-
      호출자 지정 요구·base를 가진 깨끗한 diff에 대한 실제 reviewer 반환 확인

  - id: acceptance-5
    description: >-
      범위나 요구 출처가 없거나 실제로 읽지 못한 diff에 대해 깨끗한 판정으로 끝내지 않는다.
      불명확한 기준은 중단 이유를 반환하며 미실행 기준은 산출물로 판단 불가로 분리한다.
    verifiable: true
    measurable_via: >-
      base/range 누락·요구 출처 없음 입력의 중단 형식과 실행 기준의 3상태 판정 확인

  - id: acceptance-6
    description: >-
      실행 체크가 없는 20줄 파서라도 승인된 요구에서 체크를 요구하지 않으면
      그 사실만으로 요구사항 blocking을 발명하지 않는다. 체크가 명시 요구라면 그 요구를
      대조하고, 일반 정확성·테스트 위험의 판단은 native 리뷰 축으로 남긴다.
    verifiable: true
    measurable_via: >-
      동일 diff에 테스트를 요구하는 출처가 있는 경우와 없는 경우를 각각 대조해
      요구 출처 기반 finding과 native 정확성 검사의 경계 확인

