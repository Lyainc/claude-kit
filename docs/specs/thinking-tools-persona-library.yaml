# build-spec extensions
spec_version: 1
created: 2026-07-22
target: thinking-tools-persona-library
domain: tech
brownfield: true
refine_generation: 0

goal:
  statement: >
    expert-panel과 adversarial-review가 각자 SKILL.md 안에서 매 세션 페르소나를 즉석
    생성하는 것을, thinking-tools/reference/personas.md 공유 풀을 두 스킬이 함께 인용하는
    방식으로 바꾼다. 그래서 같은 주제를 두 번 돌리면 같은 관점 집합이 나오고(재현성),
    두 스킬이 서로 다른 이름으로 같은 관점을 만들어내지 않는다(일관성). 수혜자는 두 스킬을
    반복 사용하는 사람 — 지금은 같은 결정을 재검토할 때 지난번과 다른 페르소나가 나와서
    두 판정을 나란히 놓고 비교할 수가 없다.
  clarity_score: 0.90

constraints:
  - id: c1
    type: technical
    description: >
      새 플러그인이나 새 스킬을 신설하지 않는다. 페르소나 풀은 thinking-tools/reference/
      아래 참조 파일 하나이고, 두 스킬이 그것을 인용한다.
    hard: true
    rationale: >
      #102 ADR C-2가 thin 신규 플러그인을 금지한다. reference/common-schema.md와
      reference/state-contract.md가 이미 "여러 스킬이 공유하는 참조 파일" 자리를
      정의해뒀으므로 새로 만들 구조가 없다.

  - id: c2
    type: technical
    description: >
      풀은 고정 목록이 아니라 기본값이다. 주제가 풀 밖일 때 스킬은 여전히 즉석 페르소나를
      만들 수 있어야 하고, 그 사실이 출력에 드러나야 한다.
    hard: true
    rationale: >
      thinking-tools는 도메인 무관 사고 도구다. 고정 목록으로 닫으면 도메인 밖 주제에서
      스킬 자체가 못 쓰게 된다.

  - id: c3
    type: technical
    description: >
      풀에서 페르소나를 고르는 규칙은 결정론적이어야 한다 — 주제의 도메인·키워드를 풀
      항목의 태그에 맞추는 방식. 매 호출마다 LLM이 자유롭게 3-5개를 고르는 형태는 안 된다.
    hard: true
    rationale: >
      맹점 패스 발견. 선택이 자유 판단이면 ac2("두 번 돌려 같은 집합")는 검증이 아니라
      동전 던지기가 된다. 재현성이 목표인데 선택 단계가 비결정론이면 목표 자체가 성립하지
      않는다.

  - id: c4
    type: technical
    description: >
      공유 대상은 도메인 전문가 페르소나뿐이다. adversarial-review의 고정 역할
      레이블(Attacker / Judge / Steelman Coach)은 풀 밖에 그대로 둔다.
    hard: true
    rationale: >
      맹점 패스 발견. 두 스킬의 "페르소나"는 성격이 다르다 — expert-panel은 주제별 도메인
      전문가를 뽑고, adversarial-review의 세 역할은 주제와 무관한 고정 역할이다. 후자까지
      공유 풀에 넣으면 "같은 주제에 같은 항목을 가리킨다"가 원리적으로 성립할 수 없다.
      adversarial-review 쪽 접점은 Attacker가 *어느 각도에서* 공격하느냐(스탠스)이지
      역할 레이블이 아니다.

  - id: c5
    type: resource
    description: 페르소나는 풀에 10개 안팎으로 둔다.
    hard: false
    rationale: >
      파일이 커지면 매 호출마다 읽는 비용이 늘어난다. 한 세션이 실제로 쓰는 건 3-5개다.

  - id: c6
    type: technical
    description: 기존에 등록된 가드와 테스트를 깨뜨리지 않는다.
    hard: true
    rationale: >
      특히 expert-panel의 정적 검사 thinking-tools/scripts/test/test-mode-compose.py와
      trigger-regression 검사. scripts/check-test-exitcode.py 전수가 회귀 신호다.

success_criteria:
  - id: ac1
    description: >
      thinking-tools/reference/personas.md가 존재하고, expert-panel과 adversarial-review의
      SKILL.md가 둘 다 그 경로를 인용한다.
    verifiable: true
    measurable_via: grep 2건

  - id: ac2
    description: >
      같은 주제로 expert-panel을 두 번 돌리면 선택된 페르소나 레이블 집합이 같다.
    verifiable: true
    measurable_via: 두 세션 STATE 블록의 페르소나 레이블 대조

  - id: ac3
    description: >
      풀에 없는 도메인의 주제를 주면 스킬이 즉석 페르소나로 진행하고, 그 사실이 출력에
      표기된다.
    verifiable: true
    measurable_via: 도메인 밖 주제 1회 실행

  - id: ac4
    description: 등록된 가드와 테스트가 전수 통과한다.
    verifiable: true
    measurable_via: python3 scripts/check-test-exitcode.py 단일 exit code

  - id: ac5
    description: >
      같은 주제를 adversarial-review에 넣었을 때 Attacker의 공격 스탠스가 expert-panel이
      같은 주제에서 고른 풀 항목 중 하나를 가리킨다. 고정 역할 레이블은 대조 대상이 아니다.
    verifiable: true
    measurable_via: 두 스킬 출력의 풀 항목 ID 대조 (c4로 범위 축소된 형태)

  - id: ac6
    description: >
      thinking-tools/docs/improvement-matrix.md의 W8·M1 행이 status resolved +
      resolved_in 기재로 갱신된다.
    verifiable: true
    measurable_via: 해당 문서 Governance 규칙 (항목 완료 시 resolved 표기)

context:
  existing_stack:
    - thinking-tools/skills/expert-panel (격리 서브에이전트 논증, PR #77 도입 · #145 멀티턴 확장)
    - thinking-tools/skills/adversarial-review (Attacker/Judge/Steelman Coach 고정 역할, #115 · PR #403)
    - thinking-tools/reference/ (common-schema.md, state-contract.md — 공유 참조 파일 선례)
  dependencies:
    - thinking-tools/docs/improvement-matrix.md W8 · M1 행 — 이 스펙이 그 두 행을 닫는다
  integration_points:
    - expert-panel/SKILL.md 페르소나 생성 지점
    - adversarial-review/SKILL.md Attacker 스탠스 선택 지점
    - thinking-tools/reference/personas.md (신규 1개)
  backlog_scan: >
    2026-07-22, gh issue list --state open --limit 100 — 열린 이슈 9건(#417 #412 #410
    #407 #406 #309 #140 #113 #108) 중 페르소나 또는 공유 reference 파일을 다루는 것은
    0건. 충돌 없음. 인접한 것은 #108(레이어 재설계 트래킹 epic)뿐이고 페르소나 축은 그
    하위에 없다. #140 · #113의 "세 번째 저작 도구 → 신규 플러그인" 트리거는 이 스펙이
    신규 스킬을 만들지 않으므로 발동하지 않는다.

blindspots:
  - area: assumptions
    question: >
      풀 10개 중 주제별 3-5개를 고르는 것이 결정론적 규칙인가, 매 호출 LLM 판단인가?
      후자면 ac2는 검증이 아니라 동전 던지기다.
    resolution: c3으로 접었다 — 선택 규칙은 태그 매칭으로 결정론이어야 한다.
  - area: blind-spots
    question: >
      adversarial-review의 역할이 주제 무관 고정인데, "같은 주제에 두 스킬이 같은 풀
      항목을 가리킨다"가 원리적으로 성립하는가?
    resolution: c4 + ac5로 접었다 — 공유 대상을 도메인 전문가로 좁히고, adversarial-review
      쪽 접점은 Attacker 스탠스로 재정의했다.
  - area: edge-cases
    question: >
      improvement-matrix W8·M1 행이 affected에 있는데 이를 검증하는 성공 기준이 없다.
      요구되는 최종 상태가 무엇인가?
    resolution: ac6으로 접었다 — resolved + resolved_in 기재.

ambiguity:
