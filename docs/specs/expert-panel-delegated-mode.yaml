goal:
  statement: >-
    expert-panel 패널 실행에, 긴 토론 내용을 메인 문맥에서 분리하는 단일 worker 위임 경로를
    선언된 모드로 제공한다 — 패널 전체를 서브에이전트 한 개 안에서 돌리고 SUMMARY만 메인
    컨텍스트로 반환하며, 메인 직접 실행과 품질·성공 작업당 총비용으로 비교해 평가한다.
  clarity_score: 0.9

constraints:
  - id: constraint-1
    type: technical
    description: >-
      위임 모드가 SKILL.md `## Execution Modes`의 선언된 트리거 불릿으로 존재한다.
      파서가 `- **{이름}** ("{트리거}", "{트리거}"):` 형식에 묶여 있으므로 그 형식을 지키고,
      기존 트리거 넷(엄격하게 / 격리해서 / 요약만 / transcript 없이)과 문구가 겹치지 않아야 한다.
    hard: true
    rationale: >-
      선언되지 않은 자유문구는 매 호출 모델 재량으로 해석된다. 과거 관측 2회(822,864 / 27,865)는
      사용자 문구가 달랐던 통제되지 않은 비교라, 차이를 실행 위치나 문구의 효과로 해석하지 않는다.
  - id: constraint-2
    type: technical
    description: >-
      위임 에이전트 정의에 Final_Response_Contract 블록을 넣는다 — 마지막 메시지가 산출물이고
      content-free sign-off를 금지한다.
    hard: true
    rationale: >-
      #227이 위임 반환에서 빈 sign-off 19회를 실측하고 회수비용을 문서화했으며, 그 문서화된
      완화책이 하필 "inline SUMMARY path"다. #211은 native Agent가 마지막 assistant 메시지만
      반환한다고 못박고 351k 토큰 분석이 "Complete." 하나로 잘린 사례를 남겼다. #201의
      Workflow schema 방어는 dev-harness로 이관되고 그 dev-harness가 2026-06-29 CUT으로
      철회됐으므로, 이 레포에 남은 방어는 반환 계약뿐이다. 현재 에이전트 5개가 모두 같은 문구를
      갖고 있어 새 발명이 아니라 기존 관례다.
  - id: constraint-3
    type: technical
    description: >-
      SKILL.md가 5,000 토큰 예산과 Codex의 8,000바이트 invoked-skill 상한(frontmatter 포함) 안에
      남는다. 넘으면 산문을 reference.md로 옮기고 본문엔 locator만 남긴다.
    hard: true
    rationale: >-
      실질 상한은 바이트 쪽이고 여유가 거의 없다(check-skill-token-budget.py가 둘 다 잰다). 초과 시
      산문 이동은 #447·#663·#750이 세운 기존 관례다.
  - id: constraint-4
    type: technical
    description: >-
      test-mode-compose.py의 모드 required 세트에 새 모드를 추가한다. 격리·역할 계약 verbatim 핀
      상수(`_EXCHANGE_LOOP_SECTION`·`_SKILL_ISOLATED_SECTION`·`_ROLE_CONTRACT_SECTION`)를 예전
      내용으로 되돌리거나 위임 모드 때문에 바꾸지 않는다.
    hard: true
    rationale: >-
      required 세트는 화이트리스트가 아니라 하한이라, 새 모드를 넣지 않으면 통과는 하지만 그 모드가
      게이트를 안 받는다. 핀 상수는 격리·역할 계약 텍스트를 잠그는데 이 Seed는 그 계약을 바꾸지 않는다.
  - id: constraint-5
    type: technical
    description: 신규 에이전트는 `tools:`를 명시하고, 본문이 선언한 도구를 이름으로 언급한다.
    hard: true
    rationale: >-
      #472 — 생략하면 하네스에 연결된 도구 전부를 상속한다. check-agent-tools-usage.py가
      선언과 본문 사용을 양방향으로 검사하고 코드펜스 안은 근거로 안 쳐준다.
  - id: constraint-6
    type: technical
    description: plugin.json keywords에 에이전트명을 추가하고 marketplace.json을 동기화한다. 버전은 올리지 않는다.
    hard: true
    rationale: check-version-sync.py가 CI block 가드다. 버전은 lockstep 릴리스 소관이다.
  - id: constraint-7
    type: technical
    description: >-
      비용 판단에 특정 목표 수치를 두지 않는다. 같은 과제·초기 자료·모델/effort에서 측정한 성공
      작업당 총비용과 품질로 판단하고, 확인할 수 없는 값은 미확정으로 남긴다.
    hard: false
    rationale: >-
      과거 관측치는 통제된 비교가 아니므로 목표값이 될 수 없다. 결과가 나쁘면 저비용·동등 품질을
      주장하지 않고 기본 경로도 바꾸지 않는다.
  - id: constraint-8
    type: technical
    description: 위임 모드의 트리거 한국어 문구 표현은 기존 넷과 충돌하지 않는 한 조정 가능하다.
    hard: false
    rationale: hard인 것은 모드가 선언된다는 사실이고, 어떤 문구를 고르는지는 아니다.
  - id: constraint-9
    type: other
    description: >-
      Workflow fan-out이 훗날 별도 이슈를 거쳐 들어올 경우 Claude 전용 추가 경로로 표기하고,
      Workflow가 없는 런타임에서는 기존 Agent 개별 호출로 돌아가는 fallback을 명시한다.
    hard: false
    rationale: >-
      expert-panel이 이미 Codex Portability 섹션을 갖고 있으므로 그 패턴을 잇는다. fan-out 자체는
      이 Seed 범위 밖이므로 이 제약은 선행 결정 기록이다.
  - id: constraint-10
    type: technical
    description: >-
      위임 worker는 reference.md § Role Contract를 따른다 — worker가 진행자로서 패널 진행과 최종
      종합을 맡고, 실행안·실패 검토는 필수 관점으로 포함하되 별도 에이전트나 투표자로 추가하지
      않으며, worker의 종합을 독립 검토로 표시하지 않는다. 위임과 전문가별 격리는 대체 실행 경로이고
      조용히 조합하지 않는다.
    hard: true
    rationale: >-
      역할 계약은 #793이 소유한다. worker 안의 페르소나 토론은 전문가별 독립 컨텍스트와 같은 격리
      보장을 주지 않으므로, 독립성을 표시하면 사용자가 실제보다 강한 근거로 읽는다.

success_criteria:
