constraints:
  - id: c1
    type: technical
    description: Every change must be cheaply reversible (git revert / delete). Reversibility is the guardrail that makes build-first safe, replacing pre-validation gates.
    hard: true
    rationale: The thought-chain lesson (#105) is "delete if unused," not "never build." Cheap+reversible bets can ship before validation because being wrong costs little.
  - id: c2
    type: technical
    description: File deletions go through trash-put (never rm/rm -rf). On error, ask the user; do not force-delete.
    hard: true
    rationale: local-harness P4 — irreversible delete has no recovery; route through trash.
  - id: c3
    type: technical
    description: claude-kit must stay cloneable on any machine. The /wrap orchestrator lives machine-level (~/.claude/skills, next to session-close), OUTSIDE claude-kit — never referenced by repo code.
    hard: true
    rationale: One-way dependency (claude-kit-boundary CON-5). A repo referencing a machine-level skill breaks portability.
  - id: c4
