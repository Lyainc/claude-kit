name: Plugin Validation

on:
  push:
    branches: [main, "fix/**", "feat/**", "refactor/**", "docs/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so check-trigger-regression.py can diff against origin/main
          # (a shallow clone lacks the base commit/ref the diff needs).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON manifests
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool thinking-tools/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool obsidian-vault-manager/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool vault-bridge/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool feedback-loop/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool dev-harness/.claude-plugin/plugin.json > /dev/null
          echo "All JSON manifests valid"

      - name: Check marketplace governance guards
        run: |
          # version-sync is a BLOCK guard: drift between marketplace.json and any
          # plugin.json fails CI. check-ci-coverage is now a BLOCK guard too (--strict,
          # promoted in #175 once coverage reached 0 gaps): any CLAUDE.md-registered
          # test missing from this workflow fails CI.
          python3 scripts/check-version-sync.py --self-test
          
          ec=0
          python3 scripts/check-version-sync.py || ec=$?
          if [ "$ec" -eq 1 ]; then
            echo "::error::version-sync drift detected (exit 1) — manifests must match marketplace.json"
            exit 1
          elif [ "$ec" -eq 2 ]; then
            echo "::error::version-sync fatal error (exit 2) — unreadable manifest"
            exit 2
          elif [ "$ec" -eq 3 ]; then
            echo "::error::marketplace.json missing (exit 3) — version-sync cannot proceed"
            exit 3
          elif [ "$ec" -eq 0 ]; then
            echo "version-sync OK"
          else
            # exit code outside the documented {0,1,2,3} contract (e.g. 127
            # python3-not-found, 126 permission-denied). `|| ec=$?` opted out of
            # set -e, so propagate explicitly instead of silently passing.
            echo "::error::version-sync unexpected exit $ec — environment/runner failure"
            exit "$ec"
          fi

          python3 scripts/check-ci-coverage.py --self-test
          python3 scripts/check-ci-coverage.py --strict

          # Release tooling self-tests (lockstep bump + per-plugin notes generation).
          python3 scripts/bump-version.py --self-test
          python3 scripts/gen-release-notes.py --self-test
          echo "Governance guards OK"

      - name: Check work-rules guards (#216)
        run: |
          # claude-kit-specific deterministic guards + external-linter delegation.
          # Each check ships an in-memory --self-test (planted violation + clean fixture);
          # the repo-scanning checks also run real mode (FP=0 on a clean tree).
          # check-test-exitcode real mode is intentionally NOT run here (it would re-run the
          # whole registered suite recursively); only its --self-test gates CI.
          python3 scripts/check-type-optin.py --self-test
          python3 scripts/check-type-optin.py
          python3 scripts/check-language-policy.py --self-test
          python3 scripts/check-language-policy.py
          python3 scripts/check-banned-words.py --self-test
          python3 scripts/check-banned-words.py
          python3 scripts/check-test-exitcode.py --self-test
          python3 scripts/run-linters.py --self-test
          # #209 subagent git side-effect deny hook: in-memory violation + clean (FP=0).
          python3 scripts/test/test-subagent-git-guard.py
          # #259 no-PyYAML guard: deny/allow/warn/off + regex boundary + rule_fire emit on/off.
          bash scripts/test/test-no-pyyaml-guard.sh
          echo "Work-rules guards OK"

      - name: Check shell hook syntax
        run: |
          bash -n vault-bridge/hooks/*.sh
          bash -n scripts/rules-checklist-hook.sh
          bash -n scripts/subagent-git-guard.sh
          bash -n scripts/no-pyyaml-guard.sh
          echo "Hook syntax OK"

      - name: Run vault-bridge unit tests
        run: |
          python3 vault-bridge/scripts/test/test-pre-write-guard.py
          python3 vault-bridge/scripts/test/test-pre-access-guard.py
          python3 vault-bridge/scripts/test/test-manifest-type-optin.py
          python3 vault-bridge/scripts/test/test-vault-commit-message.py
          echo "vault-bridge tests OK"

      - name: Check feedback-loop telemetry scripts
        run: |
          bash -n feedback-loop/scripts/event-logger.sh
          python3 feedback-loop/scripts/validate-schema.py --self-test
          python3 feedback-loop/scripts/test/test-report.py
          bash feedback-loop/scripts/test/test-event-logger.sh
          echo "feedback-loop telemetry checks OK"

      - name: Run dev-harness unit tests
        run: |
          # #183 — Gap-ROUTE (4-way slice router) + Gap-INV (D5 constitutional
          # invariant enforcement). Both also dogfood the real G16 goal-doc.
          python3 dev-harness/scripts/test/test-router.py
          python3 dev-harness/scripts/test/test-invariant.py
          echo "dev-harness tests OK"

      - name: Run thinking-tools trigger regression
        run: |
          python3 thinking-tools/scripts/test/check-trigger-regression.py --self-test
          # The checkout step uses fetch-depth: 0, which fetches all branches — so
          # refs/remotes/origin/main is already populated (confirmed in CI logs:
          # checkout reports "* [new branch] main -> origin/main") and the origin/main
          # diff resolves without an extra fetch. The exit-code branch is a safety net:
          # exit 2 = base ref somehow absent (surface a ::warning::, never silently
          # no-op); exit 1 = real trigger removals (report-only per CLAUDE.md policy);
          # exit 0 = clean.
          ec=0
          python3 thinking-tools/scripts/test/check-trigger-regression.py origin/main || ec=$?
          if [ "$ec" -eq 2 ]; then
            echo "::warning::trigger-regression base ref unresolved (origin/main) — diff did NOT run"
          elif [ "$ec" -eq 1 ]; then
            echo "trigger-regression: removals reported above (non-blocking, reviewer decides)"
          else
            echo "thinking-tools trigger regression OK (no removals)"
          fi

      - name: Run obsidian-vault-manager unit tests
        run: |
          python3 obsidian-vault-manager/scripts/test/test-parse-created-date.py
          python3 obsidian-vault-manager/scripts/test/test-git-activity.py
          python3 obsidian-vault-manager/scripts/test/test-read-manifest-summary.py
          python3 obsidian-vault-manager/scripts/test/test-promotion-finding.py
          python3 obsidian-vault-manager/scripts/test/audit-validate.py --infer-self-test
          bash obsidian-vault-manager/scripts/test/test-infer-tags-batch.sh
          python3 obsidian-vault-manager/scripts/test/test-vocabulary-pairs.py
          echo "obsidian-vault-manager tests OK"

  audit-dod:
    # Heavy reference-impl DoD gate (#175): gen-fixture builds a seeded vault and
    # audit-validate --dod re-derives detection counts. Split into its own job so it
    # runs in parallel and never slows the main validate job. `--dod` itself always
    # exits 0 (it measures, it does not assert), so assert-dod.py turns the measurement
    # into a real gate over the date-independent invariants.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit DoD seeded-detection gate
        run: |
          rm -rf /tmp/ovm-fixture-audit-recheck
          OVM_FIXTURE_DIR=/tmp/ovm-fixture-audit-recheck \
            bash obsidian-vault-manager/scripts/test/gen-fixture.sh --with-audit-errors
          python3 obsidian-vault-manager/scripts/test/audit-validate.py \
            /tmp/ovm-fixture-audit-recheck --dod > /tmp/dod.json
          python3 obsidian-vault-manager/scripts/test/assert-dod.py /tmp/dod.json
          echo "Audit DoD gate OK"
