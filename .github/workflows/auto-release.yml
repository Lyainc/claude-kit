name: Auto Release

# WHEN to cut a release. (HOW is release.yml, which this calls.)
#
# The policy — premise, primary trigger, backstop — is stated in RELEASING.md and
# executed by scripts/next-version.py; this workflow is only the wiring that runs it.
#
#   - `release` label on a merged PR  -> release now, version derived from the commits.
#   - >= 10 unreleased user-visible commits (feat/fix/perf/refactor/breaking) -> release
#     anyway, label or not. docs/chore never count and never trigger; they ride along.
#
# Why the backstop exists: v3.0.0 sat 79 commits behind main (three of them breaking)
# because releasing was a separate ritual with no trigger, so nobody ever did it. A CI
# *warning* would not have fixed that — a warning still needs a human to act, which is
# exactly the step that failed. This releases without asking.
#
# Loop safety: the release pushes its own `chore(release): vX.Y.Z` commit to main, which
# re-fires the `push` trigger below. next-version.py sees zero commits since the (new)
# tag and holds, so the loop terminates on the first iteration. The `concurrency` group
# additionally serialises a label-triggered run against a backstop-triggered one, and the
# second finds the tag already cut and holds.

on:
  pull_request:
    # `closed` catches the label already being on the PR at merge time (the common case).
    # `labeled` catches it being added AFTER merge (#493): GitHub does not re-fire `closed`
    # when a label changes on an already-closed PR, so without this type a post-merge
    # `release` label silently did nothing — no error, no skipped-run marker, nothing. The
    # SAME `if:` below (merged == true + labels contains `release`) already handles a
    # `labeled` event correctly: the payload's `pull_request.labels` reflects the label set
    # AFTER the add, so no separate branch is needed for it.
    types: [closed, labeled]
    # BASE-branch filter, and it is load-bearing. Chained PRs are normal here (CLAUDE.md:
    # "child PR base = parent's feature branch"), so without this a `release` label on a
    # PR merging into a *feature* branch would still fire — and since `decide` deliberately
    # checks out `main`, it would release whatever happens to sit on main, unrelated to the
    # PR that merged. An unintended tag + published release is not cheap to undo.
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

# No workflow-level write. Each job asks for exactly what it needs: `decide` only reads git
# history, and `release` (which pushes the bump commit, the tag, and the GitHub Release)
# declares its own `contents: write` — a workflow_call job does not inherit the caller's
# permissions, so that job-level grant is the one that actually applies.

jobs:
  decide:
    # The label path only makes sense for a PR that actually merged; the push path is the
    # backstop and runs on every commit that lands on main.
    # The base-ref check is redundant with the `branches:` filter above, on purpose: this
    # job releases `main` regardless of which PR woke it, so "did this PR actually target
    # main" is worth asserting where the decision is made, not only where it is routed.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    permissions:
      contents: read   # reads git history to decide; never writes
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Always judge main, never the PR's merge ref — on the pull_request event the
          # default checkout is the pre-merge state, which would miss the commits we are
          # deciding about. Full history + tags for the since-last-tag walk.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide
        id: decide
        run: |
          LABELED=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then LABELED=(--labeled); fi
          python3 scripts/next-version.py "${LABELED[@]}" | tee -a "$GITHUB_OUTPUT"

  release:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.decide.outputs.version }}
    # A workflow_call job inherits no secrets by default, and release.yml needs
    # RELEASE_SSH_KEY to push past the branch ruleset. Without this the auto path
    # silently falls back to GITHUB_TOKEN and the push is rejected. Passed by name
    # rather than `inherit` so only the one key it needs crosses over.
    secrets:
      RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
    permissions:
      contents: write

  # #642: this workflow is push-triggered, so a failure never shows up as a PR check —
  # every check stayed green while this failed silently on every main push for 12 days.
  # `if: failure()` only fires when `decide` or `release` above actually failed (a normal
  # no-release decision is a success, not a failure, so this stays silent on every
  # ordinary push). Comments on the existing issue instead of opening a new one each time
  # a release keeps failing for the same underlying reason.
  notify-failure:
    needs: [decide, release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Open or comment on the release-failure issue
        run: |
          set -euo pipefail
          TITLE="Auto Release failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Auto Release failed on \`${{ github.sha }}\`: $RUN_URL"
          # Plain list, not --search: the search API is an index that lags issue creation by
          # seconds to minutes, so two failures minutes apart would both find nothing and open
          # two issues. The REST listing is read-after-write consistent.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty" || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
