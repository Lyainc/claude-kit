goal:
  statement: >
    expert-panel과 adversarial-review가 각자 SKILL.md 안에서 매 세션 페르소나를 즉석
    생성하는 것을, thinking-tools/reference/personas.md 공유 풀을 두 스킬이 함께 인용하는
    방식으로 바꾼다. 그래서 같은 사용자 원문을 두 번 넣으면 같은 순서의 풀 항목과 ad-hoc 수가 나오고(재현성),
    두 스킬이 서로 다른 이름으로 같은 관점을 만들어내지 않는다(일관성). 수혜자는 두 스킬을
    반복 사용하는 사람이다. 풀 도입 전에는 같은 결정을 재검토할 때 다른 페르소나가 나와
    두 판정을 나란히 비교하기 어려웠으므로, 풀 선택과 세션 로컬 ad-hoc을 구분한다.
  clarity_score: 0.90

constraints:
  - id: constraint-1
    type: technical
    description: >
      새 플러그인이나 새 스킬을 신설하지 않는다. 페르소나 풀은 thinking-tools/reference/
      아래 참조 파일 하나이고, 두 스킬이 그것을 인용한다.
    hard: true
    rationale: >
      #102 ADR C-2가 thin 신규 플러그인을 금지한다. reference/common-schema.md와
      reference/state-contract.md가 이미 "여러 스킬이 공유하는 참조 파일" 자리를
      정의해뒀으므로 새로 만들 구조가 없다.

  - id: constraint-2
    type: technical
    description: >
      풀은 고정 목록이 아니라 기본값이다. 주제가 풀 밖일 때 스킬은 여전히 즉석 페르소나를
      만들 수 있어야 하고, 그 사실이 출력에 드러나야 한다.
    hard: true
    rationale: >
      thinking-tools는 도메인 무관 사고 도구다. 고정 목록으로 닫으면 도메인 밖 주제에서
      스킬 자체가 못 쓰게 된다.

  - id: constraint-3
    type: technical
    description: >-
      선택은 reference/personas.md Selection Rule을 그대로 따른다. 사용자 원문만 소문자화해
      태그를 매칭하고, Latin 태그는 단어 시작·Hangul은 부분 문자열로 판정한다. distinct tag
      hits 내림차순 후 풀 표 순서로 동률을 깨며 LLM 자유 선택·모델이 만든 Steelman·
      구현 편중으로 보인다는 이유의 추가 선정을 금지한다. 3건 이상은 상위 최대 5개,
      1–2건은 전부와 부족한 만큼 ad-hoc, 0건은 ad-hoc 3개다.
    hard: true
    rationale: >
      맹점 패스 발견. 선택이 자유 판단이면 acceptance-2("두 번 돌려 같은 집합")는 검증이 아니라
      동전 던지기가 된다. 재현성이 목표인데 선택 단계가 비결정론이면 목표 자체가 성립하지
      않는다.

  - id: constraint-4
    type: technical
    description: >-
      공유 대상은 도메인 전문가뿐이다. expert-panel의 facilitator·Moderator·
      Optimistic/Critical Practitioner와 adversarial-review의 Attacker·Judge·Steelman Coach는
      고정 역할이어서 풀 선택과 전문가 투표/정족수에 섞지 않는다. adversarial-review의
      Attacker 각도는 Steelman 이전 사용자 원문으로 매칭한 rank 1만 쓰며, 0건이면 ad-hoc 1개다.
    hard: true
    rationale: >
      맹점 패스 발견. 두 스킬의 "페르소나"는 성격이 다르다 — expert-panel은 주제별 도메인
      전문가를 뽑고, adversarial-review의 세 역할은 주제와 무관한 고정 역할이다. 후자까지
      공유 풀에 넣으면 "같은 주제에 같은 항목을 가리킨다"가 원리적으로 성립할 수 없다.
      adversarial-review 쪽 접점은 Attacker가 *어느 각도에서* 공격하느냐(스탠스)이지
      역할 레이블이 아니다.

  - id: constraint-5
    type: resource
    description: >-
      풀은 현재 10개의 기본 도메인 전문가를 제공한다. ad-hoc은 세션 로컬이고 풀에
      자동 추가하지 않는다. expert-panel은 3–5명 범위를 지키며 중도 추가는 사용자 확인 뒤에만 한다.
    hard: false
    rationale: >
      파일이 커지면 매 호출마다 읽는 비용이 늘어난다. 한 세션이 실제로 쓰는 건 3-5개다.

  - id: constraint-6
    type: technical
    description: 기존에 등록된 가드와 테스트를 깨뜨리지 않는다.
    hard: true
    rationale: >
      특히 expert-panel의 정적 검사 thinking-tools/scripts/test/test-mode-compose.py와
      trigger-regression 검사. scripts/check-test-exitcode.py 전수가 회귀 신호다.

success_criteria:
  - id: acceptance-1
    description: >
      thinking-tools/reference/personas.md가 존재하고, expert-panel과 adversarial-review의
      SKILL.md가 둘 다 그 경로를 인용한다.
    verifiable: true
    measurable_via: >-
      두 SKILL.md의 reference/personas.md 경로와 원문 입력 Selection Rule 지시 확인

  - id: acceptance-2
    description: >-
      동일 사용자 원문에 대해 expert-panel의 STATE `Personas` 순서와 `adhoc:{n}` 수가
      같다. ad-hoc 이름의 완전 동일성이나 LLM 발언 자체의 재현성을 보장하지 않는다.
    verifiable: true
    measurable_via: >-
      test-persona-selection.py의 정상·오매칭·Steelman 파생문·동률 fixture 검사와
      두 세션 STATE의 풀 ID 순서/adhoc 수 대조

  - id: acceptance-3
    description: >-
      풀 태그가 0건인 사용자 원문은 expert-panel에서 ad-hoc 3명, adversarial-review
      Attacker 각도에서 ad-hoc 1명으로 진행한다. expert-panel STATE는 `Personas: [] adhoc:3`,
      adversarial-review STATE는 `Angle: adhoc`으로 fallback을 표시한다.
    verifiable: true
    measurable_via: 도메인 밖 주제 1회 실행

  - id: acceptance-4
    description: 등록된 가드와 테스트가 전수 통과한다.
    verifiable: true
    measurable_via: >-
      uv run --no-project scripts/check-test-exitcode.py 종료 코드. 선택·모드 계약 회귀는
      test-persona-selection.py·test-mode-compose.py·check-trigger-regression.py로 확인

  - id: acceptance-5
    description: >-
      같은 사용자 원문을 두 스킬에 넣으면 adversarial-review Attacker의 Angle은
      expert-panel이 고른 순서의 rank 1 풀 ID와 같다. 태그 0건은 각자의 ad-hoc 경로를
      확인하고 고정 역할 레이블이나 ad-hoc 이름의 동일성은 대조하지 않는다.
    verifiable: true
    measurable_via: 두 스킬 출력의 풀 항목 ID 대조 (constraint-4로 범위 축소된 형태)

  - id: acceptance-6
    description: >-
      thinking-tools/docs/improvement-matrix.md의 W8·M1 행은 기존 ID를 유지한 채
      resolved 상태와 #418·personas.md 구현 근거를 표시한다. M1의 temperature variation은
      이 Seed 완료 조건에서 제외한 범위로 유지한다.
    verifiable: true
    measurable_via: >-
      해당 문서 Governance와 W8·M1의 status·근거 열 대조; 날짜 변경만으로 검증을 대신하지 않음

