goal:
  statement: >
    claude-kit 작업 시 지킬 규칙을, 새 플러그인/스킬/OMC 의존 없이 기존 native substrate
    (Claude Code hooks + scripts/check-*.py + feedback-loop/scripts/ 텔레메트리 + rules/ 문서)에 얇게 얹어
    강제한다. 범용 규칙(스타일·표현)은 외부 린터에 위임하고, claude-kit 특화 규칙만
    결정론 스크립트로 확실히 보장하며, 판단형 규칙은 작업끝 체크(soft)로 둔다.
  clarity_score: 0.85

constraints:
  - id: constraint-1
    type: other
    description: >
      메인 에이전트 stance(판단 관점)·voice(어조)를 담는 개인 런타임 지침과
      실작업 규칙을 물리적으로 분리한다. 작업 규칙은 레포 rules/ 에 두고,
      개인 머신 정책에 런타임/빌드 의존을 만들지 않는다.
    hard: true
    rationale: stance·voice·work-rule은 독립이며 공개 clone은 개인 설정 없이 동작해야 한다.

  - id: constraint-2
    type: technical
    description: >
      새 플러그인을 만들지 않는다. 규칙은 scripts/ + 개발자별 .claude/ + rules/ 에
      두고 관측은 기존 feedback-loop/scripts/ 에 위임한다.
      기존 substrate에 얹는다. (초기 "플러그인 미포함" 제약으로 복귀)
    hard: true
    rationale: >
      adversarial C1 collapsed — 범용 규칙은 외부 린터에 위임하면 플러그인에 담을 고유물이
      없고, claude-kit 특화 규칙(version-sync류)은 재사용 대상이 아니라 배포 단위가 불필요.
      thin harness(#122)와 정합. 두 번 뒤집힌 끝에 thin 논거로 재확정.

  - id: constraint-3
    type: technical
    description: >
      OMC(oh-my-claudecode) 의존 0. 검증·RCA·verifier를 OMC에 위임하지 않고
      런타임 네이티브 기능과 자족적인 레포 스크립트로 구현한다.
      검증증거→결정론 스크립트(테스트 실제 실행), RCA→rules/ 참조 문서,
      자기승인 회피(필요 시)→해당 런타임의 네이티브 subagent.
      Claude Code hooks의 차단을 Codex에서도 자동 제공된다고 가정하지 않는다.
    hard: true
    rationale: >
      사용자가 OMC 점진 제거(#204) 결정. native substrate 매핑(#132)이 대체 가능성 입증.
      OMC가 있어도 판단형 규칙은 비결정론이었으므로 제거로 인한 보장 손실 없음.

  - id: constraint-4
    type: technical
    description: >
      스타일·표현위생(범용)은 외부 린터/포매터(prettier·ruff 등)에 위임한다.
      claude-kit은 "린터가 있으면 돌려라 + 통과를 강제하라"는 얇은 위임만 하고
      린터 기능을 재구현하지 않는다. scripts/run-linters.py에서 전부 건너뛴 실행은
      exit 2로 검사하지 않았음을 알리며 통과로 판정하지 않는다.
    hard: true
    rationale: adversarial C5 MECE — 외부 린터·OMC와 기능 중복 제거. 진짜 빈칸만 담당.

  - id: constraint-5
    type: technical
    description: >
      강제 3층. (1) 하드: 외부 린터 통과 + scripts/check-*.py(version-sync, type opt-in,
      language policy, 금지어, 테스트 exit code)가 결정론적으로 차단. (2) 소프트: 작업끝
      Claude Code Stop 훅(scripts/rules-checklist-hook.sh)이 개발자별 설정에 연결된 경우
      규칙 적용 파일의 미커밋 변경이 있을 때 rules/ 체크리스트를 리마인드하고,
      메인이 자가점검한다. 훅은 비차단이며 Codex에서는 명시적 자가점검을 수행한다. (3) 사람:
      비가역·릴리스만 사용자 게이트. haiku verifier는 YAGNI로 v1 보류 — 자기승인이 실제
      문제로 드러나면 네이티브 subagent 추가.
    hard: true
    rationale: >
      결정론 가능한 항목은 하드(확실 보장), 판단형은 소프트(작업끝 체크 = 초기 요청의
      "또는 작업 마지막 체크"). 가벼움과 확실보장의 정직한 트레이드오프.

  - id: constraint-6
    type: other
    description: >
      정책(policy) vs 취향(preference)을 가른다. 기본값은 취향(레포 설정 주입,
      .prettierrc/ruff.toml 등). 객관적 손상이 입증된 규칙만 정책으로 승격해 하드코딩.
      회색지대는 취향으로 둔다.
    hard: true
    rationale: >
      adversarial R1 — "정책/취향 분류를 누가 하나" 구멍 봉합. 분류 기준 = "위반이 객관적
      손상을 내는가". 강요 회피(타인이 써도 자기 스타일 주입).

  - id: constraint-7
    type: other
    description: >
      4단계 RCA(What→Why→How→Revise)는 retro 안에 넣지 않는다. retro는 thin consumer
      (읽고 행동)로 유지. RCA는 rules/rca-checklist.md 참조 문서로 두고, 위반이 재발 패턴일
      때만 진입한다. 멈춤기준 = "결정론적 코드 변경으로 표현 가능한 레벨"(stop-at-determinism).
    hard: true
    rationale: >
      adversarial C3 collapsed — retro에 DIAGNOSE 삽입은 retro 헌법(재구현 금지) 정의상 위반.
      C2 무한후퇴 급소는 멈춤기준 + 재발 게이트(일회성 과적합 방지)로 봉합.

  - id: constraint-8
    type: technical
    description: >
      텔레메트리는 feedback-loop/scripts/event-logger.sh·report.py의 기존 인프라를
      CLAUDE_KIT_TELEMETRY=1 opt-in으로 재사용한다. 규칙 fire 이벤트를 로깅해
      never-fired(죽은 규칙)/stale 규칙을 색출하는 요구는 유지하며, 기존 rule_fire
      스키마와 report.py의 규칙별 fire 집계를 사용한다. fire는 위반 탐지 횟수이므로
      미발화만으로 규칙이 죽었거나 준수됐다고 판정하지 않는다.
    hard: false
    rationale: 관측·자가개선 레이어. 새로 만들지 않고 기존 레일 재사용.

