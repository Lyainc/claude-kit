      비가역·릴리스만 사용자 게이트. haiku verifier는 YAGNI로 v1 보류 — 자기승인이 실제
      문제로 드러나면 네이티브 subagent 추가.
    hard: true
    rationale: >
      결정론 가능한 항목은 하드(확실 보장), 판단형은 소프트(작업끝 체크 = 초기 요청의
      "또는 작업 마지막 체크"). 가벼움과 확실보장의 정직한 트레이드오프.

  - id: c6
    type: other
    description: >
      정책(policy) vs 취향(preference)을 가른다. 기본값은 취향(레포 설정 주입,
      .prettierrc/ruff.toml 등). 객관적 손상이 입증된 규칙만 정책으로 승격해 하드코딩.
      회색지대는 취향으로 둔다.
    hard: true
    rationale: >
      adversarial R1 — "정책/취향 분류를 누가 하나" 구멍 봉합. 분류 기준 = "위반이 객관적
      손상을 내는가". 강요 회피(타인이 써도 자기 스타일 주입).

  - id: c7
    type: other
    description: >
      4단계 RCA(What→Why→How→Revise)는 retro 안에 넣지 않는다. retro는 thin consumer
      (읽고 행동)로 유지. RCA는 rules/rca-checklist.md 참조 문서로 두고, 위반이 재발 패턴일
      때만 진입한다. 멈춤기준 = "결정론적 코드 변경으로 표현 가능한 레벨"(stop-at-determinism).
    hard: true
    rationale: >
      adversarial C3 collapsed — retro에 DIAGNOSE 삽입은 retro 헌법(재구현 금지) 정의상 위반.
      C2 무한후퇴 급소는 멈춤기준 + 재발 게이트(일회성 과적합 방지)로 봉합.

  - id: c8
    type: technical
    description: >
      텔레메트리는 기존 telemetry/ 인프라(event-logger.sh, report.py, lifecycle view)를
      재사용. 규칙 fire 이벤트를 로깅해 never-fired(죽은 규칙)/stale 규칙을 색출한다.
    hard: false
    rationale: 관측·자가개선 레이어. 새로 만들지 않고 기존 레일 재사용.

