goal:
  statement: >
    build-spec이 백로그 조회·독립 게이트 판정·맹점 패스로 포터블 Seed를 저작하고,
    사용자 요청에 따라 issue-raise가 이를 GitHub 이슈 본문으로 내보내게 한다.
    #282/#283으로 철회된 workflow-harness 실행 파이프라인을 복원하지 않으며,
    수혜자는 이슈를 여는 사람과 Seed를 작업 근거로 쓰는 외부 사용자다.
  clarity_score: 0.90

constraints:
  - id: constraint-1
    type: technical
    description: >
      새 플러그인을 신설하지 않는다. Seed 저작·게이트·맹점 패스·백로그 조회는
      build-spec이, 이슈 본문 저작·중복 검사·생성 승인은 기존 issue-raise가 소유한다.
    hard: true
    rationale: >
      #502가 #407/#140의 새 플러그인 금지와 새 스킬 금지를 구별했다.
      issue-raise는 format-specific 출력 스킬이며 #113의 세 번째 format-agnostic
      저작 primitive에 해당하지 않는다. 현행 소유권은 docs/skill-boundaries.md를 따른다.

  - id: constraint-2
    type: technical
    description: >
      Seed 코어는 특정 실행 런타임을 가정하지 않는다. Phase 3의 산출물은
      지금처럼 포터블한 YAML로 남는다.
    hard: true
    rationale: >
      docs/design/claude-kit-boundary.md §3의 harness → leaf 단방향 의존이 근거다.
      build-spec은 실행 하네스 API를 호출하거나 특정 runtime을 요구하지 않는다.

  - id: constraint-3
    type: other
    description: >
      이슈 트래커 중립성은 제약이 아니다. GitHub 이슈 저작을 어댑터로 붙이는 것은
      기존 계약 위반이 아니다.
    hard: false
    rationale: >
      docs/design/output-adapter-contract.md가 `issue` 포맷과 `github` destination을
      등록하고 #502의 issue-raise가 본문 저작을 소유한다. vendor-neutral 원칙은
      실행 runtime에 관한 경계이며 이슈 트래커까지 확대하는 것은 범위 혼동이다.

  - id: constraint-4
    type: technical
    description: >
      인터뷰 라운드 수를 늘리지 않는다. 맹점 패스는 게이트 통과 직후 Seed 방출 직전
      최대 1회이며, 선행 Discovery Report가 있으면 중복 패스를 건너뛴다.
    hard: true
    rationale: >
      12라운드 상한과 게이트 후 1회 원칙을 유지한다. unknown-discovery 리포트를
      feedback으로 받은 경우 중복 패스를 건너뛴다. 맹점 채택 질문은 실제 사용자
      답변을 기다리며 무응답을 채택·기각이나 완료로 간주하지 않는다.

  - id: constraint-5
    type: resource
    description: >
      게이트 독립 판정은 게이트 통과 임박 라운드에만 건다. 호출 실패·정책 차단·
      한 번 재요청한 뒤에도 최종 응답이 없으면 자체 채점으로 전환하고,
      경고와 scoring_isolated: false를 표시한다.
    hard: false
    rationale: >
      서브에이전트 spawn 비용. vault plan-2026-04-19-thinking-tools-ouroboros-execution
      §13이 같은 완화책(기본 저비용 + 고비용은 opt-in)을 이미 채택했다.

  - id: constraint-6
    type: technical
    description: >
      기존에 등록된 가드와 테스트를 깨뜨리지 않는다.
    hard: true
    rationale: 불변 제약. scripts/check-*.py 전수가 회귀 신호다.

success_criteria:
  - id: acceptance-1
    description: >
      고친 build-spec으로 새 이슈를 하나 저작해 gh issue create까지 완료하고,
      그 이슈 URL이 존재한다.
    verifiable: true
    measurable_via: >
      사용자 생성 승인 뒤 issue-raise가 반환한 이슈 URL. URL 존재는 생성만 증명하므로
      필드 매핑·백로그 결과·판정 출처는 acceptance-2~acceptance-4로 따로 확인한다.
      gh 부재·GitHub remote 부재의 초안 파일 fallback은 이 기준 충족이 아니다.

  - id: acceptance-2
    description: >
      이슈 본문에 Seed의 goal / constraints / success_criteria가 실제 레포 템플릿의
      의미와 순서에 맞게 매핑돼 있다. 별도 Acceptance 헤더가 없으면 가장 가까운
      기존 절에 체크리스트를 넣고, 템플릿에 없는 헤더를 만들지 않는다.
    verifiable: true
    measurable_via: 이슈 본문과 Seed YAML 대조

  - id: acceptance-3
    description: >
      build-spec Phase 0과 issue-raise Phase 1이 열린·닫힌 백로그를 조회하고,
      충돌·무충돌 결과 또는 SKIPPED/PARTIAL 원문을 각 산출물에 기록했다.
    verifiable: true
    measurable_via: Seed context.backlog_scan과 이슈 초안·출력의 중복 검사 결과 대조

  - id: acceptance-4
    description: >
      게이트 판정 출처가 STATE의 scoring_isolated에 기록됐다. 격리 판정을 받을 수
      없을 때는 자체 채점 경고와 false가 함께 표시돼 격리 성공과 구별된다.
    verifiable: true
    measurable_via: 격리 성공·실패 흐름의 STATE와 게이트 직전 경고 대조

  - id: acceptance-5
    description: 등록된 가드와 테스트가 전수 통과한다.
    verifiable: true
    measurable_via: scripts/check-test-exitcode.py 단일 exit code

