name: Plugin Validation

on:
  push:
    branches: [main, "fix/**", "feat/**", "refactor/**", "docs/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so check-trigger-regression.py can diff against origin/main
          # (a shallow clone lacks the base commit/ref the diff needs).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Validate JSON manifests
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool thinking-tools/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool obsidian-vault-manager/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool vault-bridge/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool feedback-loop/.claude-plugin/plugin.json > /dev/null
          echo "All JSON manifests valid"

      - name: Check marketplace governance guards
        run: |
          # version-sync is a BLOCK guard: drift between marketplace.json and any
          # plugin.json fails CI. check-ci-coverage is now a BLOCK guard too (--strict,
          # promoted in #175 once coverage reached 0 gaps): any docs/VALIDATION.md-registered
          # test missing from this workflow fails CI.
          python3 scripts/check-version-sync.py --self-test
          
          ec=0
          python3 scripts/check-version-sync.py || ec=$?
          if [ "$ec" -eq 1 ]; then
            echo "::error::version-sync drift detected (exit 1) — manifests must match marketplace.json"
            exit 1
          elif [ "$ec" -eq 2 ]; then
            echo "::error::version-sync fatal error (exit 2) — unreadable manifest"
            exit 2
          elif [ "$ec" -eq 3 ]; then
            echo "::error::marketplace.json missing (exit 3) — version-sync cannot proceed"
            exit 3
          elif [ "$ec" -eq 0 ]; then
            echo "version-sync OK"
          else
            # exit code outside the documented {0,1,2,3} contract (e.g. 127
            # python3-not-found, 126 permission-denied). `|| ec=$?` opted out of
            # set -e, so propagate explicitly instead of silently passing.
            echo "::error::version-sync unexpected exit $ec — environment/runner failure"
            exit "$ec"
          fi

          python3 scripts/check-ci-coverage.py --self-test
          python3 scripts/check-ci-coverage.py --strict

          # build-spec Phase 0 backlog prefilter (#489): closed candidates must render,
          # and an unreadable corpus must announce the skip instead of returning silence.
          python3 thinking-tools/scripts/backlog-prefilter.py --self-check

          # issue-raise template-heading conformance guard (#563): #562's actual defect
          # (`## 제안 (선택)` assembled as `## 제안`, marker dropped) pinned as a regression case.
          python3 thinking-tools/scripts/check-heading-match.py --self-test

          # Release tooling self-tests (lockstep bump + per-plugin notes generation +
          # the release-trigger policy: label / backstop / bump derivation).
          python3 scripts/bump-version.py --self-test
          python3 scripts/gen-release-notes.py --self-test
          python3 scripts/next-version.py --self-test
          # #493 — a `release` label added AFTER merge used to silently do nothing (no
          # `pull_request:labeled` trigger existed). Pins the live auto-release.yml trigger
          # + if-condition against that regressing back.
          python3 scripts/test/test-auto-release-trigger.py --self-test
          python3 scripts/test/test-auto-release-trigger.py
          echo "Governance guards OK"

      - name: Check work-rules guards (#216)
        run: |
          # claude-kit-specific deterministic guards + external-linter delegation.
          # Each check ships an in-memory --self-test (planted violation + clean fixture);
          # the repo-scanning checks also run real mode (FP=0 on a clean tree).
          # check-test-exitcode real mode is intentionally NOT run here (it would re-run the
          # whole registered suite recursively); only its --self-test gates CI.
          python3 scripts/check-type-optin.py --self-test
          python3 scripts/check-type-optin.py
          python3 scripts/check-language-policy.py --self-test
          python3 scripts/check-language-policy.py
          python3 scripts/check-banned-words.py --self-test
          python3 scripts/check-banned-words.py
          # #385 E1-EN audit-error-type label drift guard.
          python3 scripts/check-error-label-drift.py --self-test
          python3 scripts/check-error-label-drift.py
          # #472 tools: field existence, #577 declared-vs-body-usage. The first was in
          # scripts/ but wired into neither CI nor docs/VALIDATION.md until #577.
          python3 scripts/check-agent-tools-field.py --self-test
          python3 scripts/check-agent-tools-field.py
          python3 scripts/check-agent-tools-usage.py --self-test
          python3 scripts/check-agent-tools-usage.py
          python3 scripts/check-plugin-root-paths.py --self-test
          python3 scripts/check-plugin-root-paths.py
          # SKILL.md compaction budget (#454). tiktoken is fetched ephemerally by `uv run
          # --with`, so it is a dependency of this one command and of nothing else — no
          # manifest entry, no plugin runtime cost. Same invocation locally and in CI, on
          # purpose: the guard refuses to report a verdict without an exact token count, so a
          # drift between the two would show up as exit 2 rather than as a quiet disagreement.
          uv run --with tiktoken python3 scripts/check-skill-token-budget.py --self-test
          uv run --with tiktoken python3 scripts/check-skill-token-budget.py
          python3 scripts/check-test-exitcode.py --self-test
          python3 scripts/run-linters.py --self-test
          # #209 subagent git side-effect deny hook: in-memory violation + clean (FP=0).
          python3 scripts/test/test-subagent-git-guard.py
          # #451 claude-review silence guard: the verify step's jq filter is extracted and
          # executed here (jq is preinstalled on ubuntu runners; its absence exits 2, never
          # skips), plus the static step/prompt contract it depends on.
          python3 scripts/test/test-review-silence-guard.py --self-test
          python3 scripts/test/test-review-silence-guard.py
          # #259 no-PyYAML guard: deny/allow/warn/off + regex boundary + rule_fire emit on/off.
          bash scripts/test/test-no-pyyaml-guard.sh
          echo "Work-rules guards OK"

      - name: Check shell hook syntax
        run: |
          bash -n vault-bridge/hooks/*.sh
          bash -n thinking-tools/hooks/session-start-welcome.sh
          bash -n thinking-tools/hooks/next-goal-context.sh
          bash -n scripts/rules-checklist-hook.sh
          bash -n scripts/subagent-git-guard.sh
          bash -n scripts/no-pyyaml-guard.sh
          echo "Hook syntax OK"

      - name: Run vault-bridge unit tests
        run: |
          python3 vault-bridge/scripts/test/test-pre-write-guard.py
          python3 vault-bridge/scripts/test/test-manifest-type-optin.py
          python3 vault-bridge/scripts/test/test-manifest-candidates.py
          python3 vault-bridge/scripts/test/test-vault-commit-message.py
          echo "vault-bridge tests OK"

      - name: Run vault-bridge agent trigger regression
        run: |
          # #338 — sibling to the thinking-tools trigger-regression step below, same
          # warn-mode contract: self-test gates CI, the origin/main diff is report-only.
          python3 vault-bridge/scripts/test/check-trigger-regression.py --self-test
          ec=0
          python3 vault-bridge/scripts/test/check-trigger-regression.py origin/main || ec=$?
          if [ "$ec" -eq 2 ]; then
            echo "::warning::vault-bridge trigger-regression base ref unresolved (origin/main) — diff did NOT run"
          elif [ "$ec" -eq 1 ]; then
            echo "vault-bridge trigger-regression: removals reported above (non-blocking, reviewer decides)"
          else
            echo "vault-bridge trigger regression OK (no removals)"
          fi

      - name: Run vault-bridge SKILL.md trigger regression
        run: |
          # #471 — sibling to the agent check above, covers vault-bridge/skills/*/SKILL.md.
          python3 vault-bridge/scripts/test/check-skill-trigger-regression.py --self-test
          ec=0
          python3 vault-bridge/scripts/test/check-skill-trigger-regression.py origin/main || ec=$?
          if [ "$ec" -eq 2 ]; then
            echo "::warning::vault-bridge SKILL.md trigger-regression base ref unresolved (origin/main) — diff did NOT run"
          elif [ "$ec" -eq 1 ]; then
            echo "vault-bridge SKILL.md trigger-regression: removals reported above (non-blocking, reviewer decides)"
          else
            echo "vault-bridge SKILL.md trigger regression OK (no removals)"
          fi

      - name: Check feedback-loop telemetry + add-policy scripts
        run: |
          bash -n feedback-loop/scripts/event-logger.sh
          bash -n feedback-loop/scripts/retro-telemetry.sh
          python3 feedback-loop/scripts/validate-schema.py --self-test
          python3 feedback-loop/scripts/test/test-report.py
          bash feedback-loop/scripts/test/test-event-logger.sh
          bash feedback-loop/scripts/test/test-retro-telemetry.sh
          python3 feedback-loop/scripts/test/test-retro-telemetry-stamp-isolation.py
          bash feedback-loop/scripts/test/test-events-dir-resolution.sh
          # #458 sequence.py drops the started/success lifecycle pair before the n-gram window
          # (a single call used to read as an X -> X repeat, i.e. a waste signal to retro).
          python3 feedback-loop/scripts/test/test-sequence.py
          # #459 agent-inferred rule candidates are bounced to /distill, not landed unjudged.
          python3 feedback-loop/scripts/test/test-distill-gate-routing.py --self-test
          python3 feedback-loop/scripts/test/test-distill-gate-routing.py
          # G28 add-policy layer-routing (SOFT channel by layer + vanilla fallback).
          python3 feedback-loop/scripts/test/test-add-policy-routing.py --self-test
          python3 feedback-loop/scripts/test/test-add-policy-routing.py
          # #303 add-policy §6 conflict-check Edit bucket (explicit edit of an existing entry)
          # + #429 Supersede (retire the redundant entry in the same write, same confirmation).
          python3 feedback-loop/scripts/test/test-add-policy-conflict-edit.py --self-test
          python3 feedback-loop/scripts/test/test-add-policy-conflict-edit.py
          # #450 add-policy necessity gate (four questions, three outcomes, recommends only).
          python3 feedback-loop/scripts/test/test-add-policy-necessity-gate.py --self-test
          python3 feedback-loop/scripts/test/test-add-policy-necessity-gate.py
          # #340 add-policy §6 index+detail split (match an existing site's index+detail shape).
          python3 feedback-loop/scripts/test/test-add-policy-index-detail.py --self-test
          python3 feedback-loop/scripts/test/test-add-policy-index-detail.py
          echo "feedback-loop telemetry + add-policy-routing checks OK"

      - name: Run feedback-loop trigger regression
        run: |
          # #471 — routing-SSOT drift guard extended to feedback-loop/skills/*/SKILL.md.
          python3 feedback-loop/scripts/test/check-trigger-regression.py --self-test
          ec=0
          python3 feedback-loop/scripts/test/check-trigger-regression.py origin/main || ec=$?
          if [ "$ec" -eq 2 ]; then
            echo "::warning::feedback-loop trigger-regression base ref unresolved (origin/main) — diff did NOT run"
          elif [ "$ec" -eq 1 ]; then
            echo "feedback-loop trigger-regression: removals reported above (non-blocking, reviewer decides)"
          else
            echo "feedback-loop trigger regression OK (no removals)"
          fi

      - name: Run thinking-tools trigger regression
        run: |
          python3 thinking-tools/scripts/test/check-trigger-regression.py --self-test
          # The checkout step uses fetch-depth: 0, which fetches all branches — so
          # refs/remotes/origin/main is already populated (confirmed in CI logs:
          # checkout reports "* [new branch] main -> origin/main") and the origin/main
          # diff resolves without an extra fetch. The exit-code branch is a safety net:
          # exit 2 = base ref somehow absent (surface a ::warning::, never silently
          # no-op); exit 1 = real trigger removals (report-only per CLAUDE.md policy);
          # exit 0 = clean.
          ec=0
          python3 thinking-tools/scripts/test/check-trigger-regression.py origin/main || ec=$?
          if [ "$ec" -eq 2 ]; then
            echo "::warning::trigger-regression base ref unresolved (origin/main) — diff did NOT run"
          elif [ "$ec" -eq 1 ]; then
            echo "trigger-regression: removals reported above (non-blocking, reviewer decides)"
          else
            echo "thinking-tools trigger regression OK (no removals)"
          fi

      - name: Run thinking-tools AGENT trigger regression
        run: |
          # #471 — sibling to the SKILL.md check above, covers thinking-tools/agents/*.md
          # (thinking-facilitator.md's inline `(e.g., '...')` example clause, not the
          # `Trigger when user mentions:` block the skill-level check parses).
          python3 thinking-tools/scripts/test/check-agent-trigger-regression.py --self-test
          ec=0
          python3 thinking-tools/scripts/test/check-agent-trigger-regression.py origin/main || ec=$?
          if [ "$ec" -eq 2 ]; then
            echo "::warning::thinking-tools agent trigger-regression base ref unresolved (origin/main) — diff did NOT run"
          elif [ "$ec" -eq 1 ]; then
            echo "thinking-tools agent trigger-regression: removals reported above (non-blocking, reviewer decides)"
          else
            echo "thinking-tools agent trigger regression OK (no removals)"
          fi

      - name: Run expert-panel mode-compose regression
        run: |
          # #228 — guards the "all combinations compose silently" claim in expert-panel SKILL.md.
          python3 thinking-tools/scripts/test/test-mode-compose.py --self-test
          python3 thinking-tools/scripts/test/test-mode-compose.py
          python3 thinking-tools/scripts/test/test-persona-selection.py --self-test
          python3 thinking-tools/scripts/test/test-persona-selection.py
          echo "expert-panel mode-compose OK"

      - name: Run session-start onboarding hook regression
        run: |
          # #117 — first-run onboarding hint: 3-session grace, kill switch, JSON shape.
          bash thinking-tools/scripts/test/test-session-start-welcome.sh
          echo "session-start-welcome OK"

      - name: Run next-goal candidate-pool hook regression
        run: |
          # #517 — matcher must fire on the qualified plugin skill name (#406: porting the
          # bare machine key makes it never fire), and a failed backlog lookup must never
          # render as an empty backlog. gh is stubbed on PATH, so this needs no network.
          bash thinking-tools/scripts/test/test-next-goal-hook.sh
          echo "next-goal-hook OK"

      - name: Run next-candidate chain_depth/top_areas unit tests
        run: |
          # #521 — direct edge coverage (0 commits, root-file `·` prefix, multi-area
          # branching) the e2e hook test above only exercises indirectly.
          python3 thinking-tools/scripts/test/test-next-candidate.py
          echo "next-candidate unit tests OK"

      - name: Run obsidian-vault-manager unit tests
        run: |
          python3 obsidian-vault-manager/scripts/test/test-parse-created-date.py
          python3 obsidian-vault-manager/scripts/test/test-git-activity.py
          python3 obsidian-vault-manager/scripts/test/audit-validate.py --infer-self-test
          bash obsidian-vault-manager/scripts/test/test-infer-tags-batch.sh
          python3 obsidian-vault-manager/scripts/test/test-vocabulary-pairs.py
          python3 obsidian-vault-manager/scripts/test/test-e5-candidate-ranking.py
          python3 obsidian-vault-manager/scripts/test/test-wiki-self-audit.py
          python3 obsidian-vault-manager/scripts/test/test-manifest-reads.py
          python3 obsidian-vault-manager/scripts/test/test-audit-state-corrupt.py
          python3 obsidian-vault-manager/scripts/test/test-wikilink-code-masking.py
          # #531 notes/ filename convention parity gate: audit's filename_conforms() vs
          # pre-write-guard.sh's notes/ pattern must agree.
          python3 obsidian-vault-manager/scripts/test/test-notes-filename-consistency.py
          echo "obsidian-vault-manager tests OK"

      - name: Run obsidian-vault-manager trigger regression
        run: |
          # #471 — routing-SSOT drift guard extended to obsidian-vault-manager/skills/*/SKILL.md
          # + obsidian-vault-manager/agents/*.md (one script, one face per the issue's table).
          python3 obsidian-vault-manager/scripts/test/check-trigger-regression.py --self-test
          ec=0
          python3 obsidian-vault-manager/scripts/test/check-trigger-regression.py origin/main || ec=$?
          if [ "$ec" -eq 2 ]; then
            echo "::warning::obsidian-vault-manager trigger-regression base ref unresolved (origin/main) — diff did NOT run"
          elif [ "$ec" -eq 1 ]; then
            echo "obsidian-vault-manager trigger-regression: removals reported above (non-blocking, reviewer decides)"
          else
            echo "obsidian-vault-manager trigger regression OK (no removals)"
          fi

  audit-dod:
    # Heavy reference-impl DoD gate (#175): gen-fixture builds a seeded vault and
    # audit-validate --dod re-derives detection counts. Split into its own job so it
    # runs in parallel and never slows the main validate job. `--dod` itself always
    # exits 0 (it measures, it does not assert), so assert-dod.py turns the measurement
    # into a real gate over the date-independent invariants.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit DoD seeded-detection gate
        run: |
          rm -rf /tmp/ovm-fixture-audit-recheck
          OVM_FIXTURE_DIR=/tmp/ovm-fixture-audit-recheck \
            bash obsidian-vault-manager/scripts/test/gen-fixture.sh --with-audit-errors
          python3 obsidian-vault-manager/scripts/test/audit-validate.py \
            /tmp/ovm-fixture-audit-recheck --dod > /tmp/dod.json
          python3 obsidian-vault-manager/scripts/test/assert-dod.py /tmp/dod.json
          echo "Audit DoD gate OK"
