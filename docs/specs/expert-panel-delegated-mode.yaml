    expert-panel 패널 실행에, 재현 가능한 저비용 경로를 선언된 위임 모드로 제공한다 —
    패널 전체를 서브에이전트 한 개 안에서 돌리고 SUMMARY만 메인 컨텍스트로 반환한다.
