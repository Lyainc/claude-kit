goal:
  statement: >-
    expert-panel 패널 실행에, 긴 토론 내용을 메인 문맥에서 분리하는 단일 worker 위임 경로를
    선언된 모드로 제공한다. 패널 전체를 서브에이전트 한 개 안에서 돌리고 SUMMARY 본문과
    진행 기록만 메인 컨텍스트로 반환하며, 메인 직접 실행과 품질·성공 작업당 총비용으로 비교해 평가한다.
  clarity_score: 0.9

constraints:
  - id: constraint-1
    type: technical
    description: >-
      위임 모드가 SKILL.md `## Execution Modes`의 선언된 트리거 불릿으로 존재한다.
      파서가 `- **{이름}** ("{트리거}", "{트리거}"):` 형식에 묶여 있으므로 그 형식을 지키고,
      기존 트리거 넷(엄격하게 / 격리해서 / 요약만 / transcript 없이)과 문구가 겹치지 않아야 한다.
    hard: true
    rationale: >-
      선언되지 않은 자유문구는 매 호출 모델 재량으로 해석된다. 과거 관측 2회(822,864 / 27,865)는
      사용자 문구가 달랐던 통제되지 않은 비교라, 차이를 실행 위치나 문구의 효과로 해석하지 않는다.
  - id: constraint-2
    type: technical
    description: >-
      위임 에이전트 정의에 `## Final Response Contract`를 둔다. 마지막 메시지가 SUMMARY
      본문과 진행 기록을 담은 산출물이고, content-free sign-off나 파일 경로만 반환하는 형태를 금지한다.
    hard: true
    rationale: >-
      #211의 마지막 assistant 메시지 반환 계약을 따른다. #227의 빈 sign-off 실패는
      파일 생성만으로 방어되지 않으므로 호출자가 실제 반환 본문을 확인해야 한다.

  - id: constraint-3
    type: technical
    description: >-
      SKILL.md가 5,000 토큰 예산과 Codex의 8,000바이트 invoked-skill 상한(frontmatter 포함)
      안에 남는다. 근거·긴 예제는 reference.md로 옮길 수 있지만 실행 순서·승인 게이트·fallback·
      금지·출력 필드·Codex 분기는 본문에 유지하고, 이동한 binding 절은 읽을 시점을 명시한다.
    hard: true
    rationale: >-
      실질 상한은 바이트 쪽이고 여유가 거의 없다(check-skill-token-budget.py가 둘 다 잰다). 초과 시
      산문 이동은 #447·#663·#750이 세운 기존 관례다.
  - id: constraint-4
    type: technical
    description: >-
      test-mode-compose.py required 세트는 격리 실행·요약 출력·위임 실행을 검사한다.
      격리·선택·역할 계약의 verbatim 핀 상수(`_EXCHANGE_LOOP_SECTION`·
      `_SKILL_ISOLATED_SECTION`·`_ROLE_CONTRACT_SECTION`·`_SELECTION_GUIDE_SECTION`·
      `_SKILL_SELECTION_SECTION`)를 예전 내용으로 되돌리거나 위임 모드 때문에 바꾸지 않는다.
    hard: true
    rationale: >-
      required 세트는 화이트리스트가 아니라 하한이라, 새 모드를 넣지 않으면 통과는 하지만 그 모드가
      게이트를 안 받는다. 핀 상수는 격리·역할 계약 텍스트를 잠그는데 이 Seed는 그 계약을 바꾸지 않는다.
  - id: constraint-5
    type: technical
    description: 신규 에이전트는 `tools:`를 명시하고, 본문이 선언한 도구를 이름으로 언급한다.
    hard: true
    rationale: >-
      #472 — 생략하면 하네스에 연결된 도구 전부를 상속한다. check-agent-tools-usage.py가
      선언과 본문 사용을 양방향으로 검사하고 코드펜스 안은 근거로 안 쳐준다.
  - id: constraint-6
    type: technical
    description: >-
      Claude 에이전트 등록은 thinking-tools/.claude-plugin/plugin.json의 keywords와 description에
      반영하고 .claude-plugin/marketplace.json을 동기화한다. root portable plugin.json은
      별도 메타데이터를 소유하고 name/version만 Claude manifest와 lockstep이며 버전은 직접 올리지 않는다.
    hard: true
    rationale: check-version-sync.py가 CI block 가드다. 버전은 lockstep 릴리스 소관이다.
  - id: constraint-7
    type: technical
    description: >-
      비용 판단에 특정 목표 수치를 두지 않는다. 같은 과제·초기 자료·모델/effort에서 측정한 성공
      작업당 총비용과 품질로 판단하고, 확인할 수 없는 값은 미확정으로 남긴다.
    hard: false
    rationale: >-
      과거 관측치는 통제된 비교가 아니므로 목표값이 될 수 없다. 결과가 나쁘면 저비용·동등 품질을
      주장하지 않고 기본 경로도 바꾸지 않는다.
  - id: constraint-8
    type: technical
    description: 위임 모드의 트리거 한국어 문구 표현은 기존 넷과 충돌하지 않는 한 조정 가능하다.
    hard: false
    rationale: hard인 것은 모드가 선언된다는 사실이고, 어떤 문구를 고르는지는 아니다.
  - id: constraint-9
    type: other
    description: >-
      Workflow fan-out이 훗날 별도 이슈를 거쳐 들어오면 Claude 전용 추가 경로로 표기하고,
      Workflow가 없는 환경에서는 기존 runtime-native 호출 경로를 유지한다. 현재 Codex는 codex-portability.md에 따라 실제 제공되는 native subagent 도구만 쓰거나
      현재 컨텍스트에서 실행한다. Claude Agent 타입·모델·Workflow·훅을 Codex 기능으로 가정하지 않는다.
    hard: false
    rationale: >-
      expert-panel이 이미 Codex Portability 섹션을 갖고 있으므로 그 패턴을 잇는다. fan-out 자체는
      이 Seed 범위 밖이므로 이 제약은 선행 결정 기록이다.
  - id: constraint-10
    type: technical
    description: >-
      위임 worker는 reference.md § Role Contract를 따른다. 진행·종합과 실행안·실패 검토를
      한 컨텍스트 안에서 수행하고 별도 에이전트·투표자를 더하지 않으며, 종합을
      `[Moderator — 진행자 종합]`으로 표시한다. 반박은 최대 2회, 사실 부족은 held:evidence로
      보류하고 전문가 추가는 호출자 확인을 위한 제안만 한다. 위임과 전문가별 격리는 대체
      경로이므로 의도가 불명확하면 사용자 답을 기다린다. file trigger가 있으면 worker는
      transcripts와 UNRESOLVED.md를 쓰고 호출자가 반환 본문으로 SUMMARY.md를 쓴다.
      요약 출력에서는 transcripts를 생략한다.
      요약만 있어도 진행 기록이 없으면 한 번 재요청하고 계속 없으면 `절차 확인 불가`로 전달한다.
    hard: true
    rationale: >-
      역할 계약은 #793이 소유한다. worker 안의 페르소나 토론은 전문가별 독립 컨텍스트와 같은 격리
      보장을 주지 않으므로, 독립성을 표시하면 사용자가 실제보다 강한 근거로 읽는다.

success_criteria:
  - id: acceptance-1
    description: >-
      메인 직접 실행과 단일 worker 위임을 같은 과제·초기 자료·완료 조건·모델/effort로 비교해,
      메인 + worker + 검토·회수 + 재시도의 전체 사용량, cache write/read, 완료 시간, 반환 누락,
      근거 품질과 반대 논거 보존을 기록한다.
    verifiable: true
    measurable_via: >-
      두 실행의 transcript 사용량 집계(cache_creation/read 포함)와 결과물 대조 — 실제 모델·effort·연결
      방식·TTL·도구 접근 차이를 함께 명시하고 확인 못 한 값은 미확정으로 남김
  - id: acceptance-2
    description: >-
      위임 반환이 SUMMARY 본문(결론·근거·권고·소수 의견·적용 조건·불확실성·미해결),
      Phase 0 backlog line, 토픽 outcome·투표 실행 시 내역·실제 생성 파일 경로와 진행 기록을 담는다.
      진행 기록은 한 컨텍스트 시뮬레이션임을 표시하고 브리핑·전문가별 독립 발언 요지·
      실행안/실패 검토·0–2회 반박과 중단 이유·outcome을 토픽별로 유지한다. 요약 출력에서도
      진행 기록을 생략하지 않으며, 파일 출력 시 호출자가 SUMMARY.md를 작성한다.
    verifiable: true
    measurable_via: >-
      실호출 반환 본문·호출자 relay·파일 작성 주체 확인, test-mode-compose.py의 worker audit·
      role label·누락 반환 재요청 계약 검사. 정적 검사만으로 실호출 품질이나 비용 동등성을 주장하지 않음

  - id: acceptance-3
    description: 가드 전수 green.
    verifiable: true
    measurable_via: >-
      test-mode-compose.py, check-agent-tools-field.py, check-agent-tools-usage.py,
      check-skill-token-budget.py, check-version-sync.py, check-trigger-regression.py

