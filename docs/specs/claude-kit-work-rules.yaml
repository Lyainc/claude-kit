      claude-kit은 "린터가 있으면 돌려라 + 통과를 강제하라"는 얇은 위임만 하고
      린터 기능을 재구현하지 않는다.
    hard: true
    rationale: adversarial C5 MECE — 외부 린터·OMC와 기능 중복 제거. 진짜 빈칸만 담당.

  - id: c5
