# ── refine 사유 ──────────────────────────────────────────────
# unknown-discovery가 docs/specs/harness-doctor.yaml(v1)을 대상으로 Quick Discovery Mode
# 인터뷰를 진행해 Assumptions 영역에서 3건의 미결 발견을 냈다. 세 건 모두 이번 refine
