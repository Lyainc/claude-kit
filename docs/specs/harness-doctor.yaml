goal:
  statement: >-
    도구가 자기 페이로드를 남의 위치로 복사해 설치할 때 생기는 "주인 없는 사본"의
    드리프트를, 사람이 기억해서 돌리지 않아도 세션 시작 시점에 결정적으로 감지해
    수정 명령과 함께 알린다.
  clarity_score: 0.85

# 근본 진단 (스펙의 전제) — 참조 기반 설치는 자가치유되고, 복사 기반만 썩는다.
#   참조: 플러그인 훅(${CLAUDE_PLUGIN_ROOT}) → 핀만 옮기면 훅이 따라옴 (2026-07-22 실증)
#   복사: graphify git 훅 / 스킬 / PreToolUse → 사본에 주인이 없어 영구히 뒤처짐
# 따라서 감지 대상은 "오래된 것"이 아니라 "복사된 것"이다.

constraints:
  - id: c1
    type: technical
    description: 결정적 셸/스크립트만 사용. LLM 호출 0, per-turn 비용 0.
    hard: true
    rationale: >-
      SessionStart에 상시로 붙는 물건이라 LLM 비용이 붙으면 첫 번째로 꺼진다.
      기존 rm-guard.sh / session-start-manifest.sh 선례와 동일한 계열.

  - id: c2
    type: technical
    description: >-
      존재 확인이 아니라 내용 해시 대조로 판정한다. 마커/파일 존재만 보는 멱등
      검사는 금지.
    hard: true
    rationale: >-
      2026-07-22 실측: `graphify hook install`이 `# graphify-hook-start` 마커만
      보고 "already installed"를 반환하는 바람에, 1,856B(0.4.1) 훅이 9,432B
      템플릿으로 영영 갱신되지 않았다. "already installed"는 "최신"이 아니다.

  - id: c3
    type: technical
    description: 드리프트가 없으면 완전 침묵. 깨끗한 상태에서 출력 0바이트.
    hard: true
    rationale: >-
      항상 울리는 경고는 안 보인다. graphify는 스킬 버전 불일치 경고를 매 실행마다
      수백 번 출력했지만 아무도 읽지 않았다 — 탐지가 아니라 신호 희석이 실패 원인.
      드리프트는 드물어야 정상이므로, 울리면 진짜라는 신뢰를 유지한다.

  - id: c4
    type: technical
    description: 탐지는 자동, 수정은 수동. 자동 수정(--fix)을 넣지 않는다.
    hard: true
    rationale: >-
      2026-07-22 세션에서 `graphify cluster-only`가 무인으로 커뮤니티 라벨을
      파일명 폴백으로 되돌렸다. 백업이 있어 복구했지만, 자동 적용이었다면 알아채지
      못했을 것. 대신 복사·붙여넣기 가능한 수정 명령을 출력해 마찰을 줄인다.

  - id: c5
    type: technical
    description: >-
      실행 예산 상한 200ms. 초과하면 조용히 건너뛰고 그 사실만 기록한다.
      성능 캐시는 허용하되(대상 파일 mtime 무변이면 해시 재계산 스킵),
      "결과가 지난번과 같으면 침묵"하는 캐시는 금지.
    hard: true
    rationale: >-
      세션 시작을 늦추는 순간 꺼진다. 결과 기반 침묵 캐시는 c3의 취지를 뒤집어
      무시를 학습시킨다.

  - id: c6
    type: technical
    description: >-
      스캔 대상을 하드코딩 목록이 아니라 자동 발견으로 구한다
      (~/dev/prj/* + ~/vault의 .git/hooks, ~/.claude/plugins/installed_plugins.json,
      ~/.claude/skills/*, PATH상 동일 명령 중복).
    hard: false
    rationale: >-
      목록 자체가 노후화하는 것이 바로 지금 고치려는 병이다. 새 레포에서
      예상 못한 경고가 나올 수 있으나, 그건 침묵 실패보다 나은 방향의 오류다.

  - id: c7
    type: technical
    description: >-
      local-harness `rules/`에만 산다. claude-kit 레포는 이 스크립트에 런타임/빌드
      의존이 0이어야 한다.
    hard: true
    rationale: >-
      boundary §0(claude-kit ↔ local-harness 이식성). 감사 대상이 머신 스코프이고
      claude-kit은 스캔 대상 8개 중 하나일 뿐이라, 공개 마켓플레이스 플러그인이
      사용자 머신 상태를 훑는 모양이 되면 방향이 뒤집힌다.
      #209(서브에이전트 git 계약) 선례와 동일한 배치 — 추상 what+why는 머신 레벨,
      구체 강제는 필요한 프로젝트에.

  - id: c8
    type: other
    description: 작업은 local-harness에서 하되 추적 이슈는 claude-kit에 등록한다.
    hard: false
    rationale: local-harness는 자체 이슈 트래커가 없다 (#229 / #234 / #298 선례).

success_criteria:
  - id: ac1
    description: >-
      2026-07-22에 실제로 발생한 드리프트 4건을 픽스처로 고정하고, 감지기가 네 건을
      모두 잡는다.
    verifiable: true
    measurable_via: >-
      회귀테스트 픽스처 4종 —
      (1) git 훅 본문이 구버전(1,856B)이고 템플릿은 9,432B인 상태,
      (2) 동일 명령이 두 채널에 존재(/opt/homebrew/bin + ~/.local/bin),
      (3) installed_plugins.json에 한 플러그인의 버전이 2개 이상,
      (4) ~/.claude/skills/*/.graphify_version 스탬프가 패키지 버전과 불일치.

  - id: ac2
    description: 드리프트가 없는 깨끗한 머신 상태에서 출력이 0바이트다(오탐 0).
    verifiable: true
    measurable_via: 정상 상태 픽스처에서 stdout/stderr 길이 == 0 이고 exit 0.

  - id: ac3
    description: 각 드리프트 항목이 복사·붙여넣기 가능한 수정 명령을 동반한다.
    verifiable: true
    measurable_via: >-
      드리프트 픽스처 4종 각각의 출력에 실행 가능한 명령 문자열이 1개 이상 포함되고,
      그 명령을 실행하면 다음 스캔에서 해당 항목이 사라진다(왕복 검증).

  - id: ac4
    description: SessionStart에서 실행해도 체감 지연이 없다.
    verifiable: true
    measurable_via: 전체 스캔 실행시간 < 200ms (캐시 워밍 후), 초과 시 스킵 경로 동작 확인.

  - id: ac5
    description: >-
      추상 규칙이 local-harness rules/ 카탈로그에 P12로 등재되고, README 표에서
      참조된다.
    verifiable: true
    measurable_via: >-
      rules/policies/P12.md 존재 + rules/README.md 정책 표에 행 추가 +
      Layer/Tier/Scope 기재 (work-rule / HARD-candidate / broad).

