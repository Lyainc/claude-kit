blindspots:
  - area: assumptions
    question: >
      풀 10개 중 주제별 3-5개를 고르는 것이 결정론적 규칙인가, 매 호출 LLM 판단인가?
      후자면 acceptance-2는 검증이 아니라 동전 던지기다.
    resolution: constraint-3으로 접었다 — 선택 규칙은 태그 매칭으로 결정론이어야 한다.
  - area: blind-spots
    question: >
      adversarial-review의 역할이 주제 무관 고정인데, "같은 주제에 두 스킬이 같은 풀
      항목을 가리킨다"가 원리적으로 성립하는가?
    resolution: constraint-4 + acceptance-5로 접었다 — 공유 대상을 도메인 전문가로 좁히고, adversarial-review
      쪽 접점은 Attacker 스탠스로 재정의했다.
  - area: edge-cases
    question: >
      improvement-matrix W8·M1 행이 affected에 있는데 이를 검증하는 성공 기준이 없다.
      요구되는 최종 상태가 무엇인가?
    resolution: acceptance-6으로 접었다. 현재 Governance의 status·근거 열을 대조한다.

