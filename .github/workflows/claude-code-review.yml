name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # DO NOT add a `paths:` filter here. A required check that is skipped by a path
    # filter reports no status at all, so the PR sits pending forever instead of
    # going green (same judgment as Lyainc/filme #594). The stock template offers the
    # filter as "optional"; for this repo it is a trap, not an option.

# One review run per PR at a time. Two pushes seconds apart otherwise start two runs whose
# windows overlap: the second one's timestamp predates the first one's comment, so a run that
# posted nothing counts its sibling's comment and passes — the round-scoping below assumes
# rounds are sequential, and this key is what makes them so.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `write`, not `read`: the inline-comment MCP server posts under `github.token`, so a
      # read-only scope makes every `create_inline_comment` 403. This trigger is
      # `pull_request` (never `pull_request_target`), so a fork PR still gets a read-only
      # token and no secrets regardless of what is written here.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the validation suite the review runs includes
          # check-trigger-regression.py's origin/main diff (validate.yml needs the same).
          fetch-depth: 0

      # Read before the review runs, so the verify step below counts only THIS round's
      # comments. A plain "does the PR have a claude comment" count passes on every
      # `synchronize` re-run as soon as round 1 left one behind — which turns the guard
      # off exactly where silence is hardest to notice. The 60s cushion absorbs clock skew
      # between this runner and GitHub's comment timestamps; a prior round landing inside
      # that window is not a case that occurs (a review takes minutes).
      - name: Record review start time
        id: review_start
        run: echo "at=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Cover these dimensions, but weight substance over style:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions.

            ## Verify by running, not by tracing

            When this PR touches any test, script, hook, workflow, or `docs/VALIDATION.md`
            file, RUN the repo's registered validation suite with your Bash tool before
            writing the review:

                python3 scripts/check-test-exitcode.py

            `docs/VALIDATION.md` is this repo's single source of truth for validation
            commands; that runner executes every command registered there and exits nonzero
            if any of them fails (add `--json` for per-command exit codes and stderr tails).
            Quote its actual output AND the exit code in your review comment. Any finding a
            run would settle must be settled by running it — this command is allowlisted, so
            never report it as unexecutable in the sandbox. One documented exception before
            you call a failure a bug: `check-trigger-regression.py origin/main` exits 1 when
            triggers were removed, and validate.yml treats that as report-only — judge
            whether the removal was intentional instead of auto-tagging it P0.

            ## Severity gate (REQUIRED — classify every finding)

            Tag EVERY finding with one severity and act on it per the gate:
            - **P0 (blocking)**: real bugs, security holes, data loss, broken build/tests.
              Must be fixed in THIS PR.
            - **P1 (should-fix)**: correctness risks, missing tests for changed logic,
              contract/spec violations. Fix in THIS PR unless the author defers with a reason.
            - **P2 (nit)**: style, naming, micro-optimizations, subjective preferences.
              Do NOT request changes for these in this PR. DEFER them — never silently drop:
              collect all P2 nits into a single backlog issue. First run
              `gh issue list --search "deferred review nits PR #${{ github.event.pull_request.number }}"`;
              if none exists and there ARE P2 nits, `gh issue create` one titled
              `chore: deferred review nits PR #${{ github.event.pull_request.number }}`
              listing them, then link it from your PR comment. At most ONE such issue per PR.

            ## Where each finding goes (REQUIRED)

            Two surfaces, and every P0/P1 lands on BOTH:
            - **Inline**, at the line it is about, via
              `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`.
              Pass `confirmed: true` on every final review comment — without it the call is
              buffered and a post-session classifier decides whether it survives, which is
              exactly the silent drop the section below forbids. Inline only works on lines
              inside this PR's diff; for a finding about code the diff does not touch, skip
              the inline comment and keep it in the summary. Do not retry a rejected line.
            - **Summary comment**, which must list EVERY P0/P1 finding in full — including
              the ones already posted inline. It is the complete record: the guard counts it,
              and the next round reads it (see below). A summary that says "see inline"
              instead of restating the findings breaks both.

            ## Stop conditions (no infinite review rounds)

            - **No re-flagging**: do NOT re-raise a point already raised or already addressed
              in a previous round. Read prior review comments first
              (`gh pr view ${{ github.event.pull_request.number }} --comments`) and skip
              anything covered in a prior round. That command shows summary comments and
              review bodies but NOT inline comments, which is why the summary above has to
              restate every inline finding — it is the only prior-round record you can read.
            - Only unresolved P0/P1 findings justify requesting another review round on this PR.
              P2 nits go to the backlog issue, not another round.

            ## Shift-left boundary (do not redefine)

            Substantive quality gating (P0/P1) is owned by the pre-push quality gate tracked
            in #134. This CI review is the fresh-eyes safety net — an external, independent
            pass that catches what slipped through — NOT the primary quality gate. Do not
            duplicate or re-specify that gate's rules here.

            Use `gh pr comment` with your Bash tool to leave the summary comment on the PR.
            Group findings by severity (P0 / P1 / Deferred nits (P2)) and link the backlog
            issue under the P2 group. P2 nits go to the backlog issue only — never inline.

            ## Silence is not a review (REQUIRED)

            Leave that comment even when you found nothing — a clean review is
            `P0/P1 없음 — LGTM` plus what you actually ran. Posting zero comments is
            forbidden: from the Checks tab a silent job is indistinguishable from a review
            that never ran, so a step after this one counts the comments this round posted
            and FAILS the job at zero. Inline comments do NOT satisfy it and are not meant
            to — they are a navigation layer over the summary, not a replacement for it. If
            you are about to end the turn without having run `gh pr comment`, that is the
            bug — post the summary first.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # gh issue create is allowed so P2 nits can be bundled into a single backlog issue
          # (deferred, never silently dropped); the prompt dedups to at most one issue per PR.
          # check-test-exitcode.py is the ONE validation entry allowed: it runs every command
          # registered in docs/VALIDATION.md (the single source of truth) in ~15s, so the review
          # can settle test-behavior claims by running them instead of tracing statically.
          # Allowlisting that one runner instead of ~70 individual commands keeps the list from
          # drifting away from docs/VALIDATION.md, and stays read/verify-only — no write or
          # network command is added here.
          # mcp__github_inline_comment__create_inline_comment is the action's own purpose-built
          # server, chosen over opening `Bash(gh api:*)`: it can post a review comment on a line
          # and nothing else, so the review still cannot approve a PR or reach any other endpoint
          # (anthropics/claude-code-action src/mcp/github-inline-comment-server.ts). Naming the
          # tool is also what makes the action start that server at all — it is installed only
          # for a PR context when an mcp__github_inline_comment__ tool appears in this list.
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(python3 scripts/check-test-exitcode.py:*),mcp__github_inline_comment__create_inline_comment"'

      # The prompt above ASKS for a comment; this step is what makes the ask enforceable
      # (#451). Without it the job is green whether the review posted its findings or died
      # before writing anything, and the Checks tab shows the same tick either way.
      # `if: always()` on purpose: a review that failed mid-run is precisely the case that
      # must not be laundered into a pass by an earlier step's red already being visible.
      # Reading comments needs only the `issues: read` this job already holds — the summary
      # comment is posted under the review's own token, not GITHUB_TOKEN. It counts summary
      # comments only, and must keep doing so: inline review comments live on a different
      # endpoint that `gh pr view --json comments` does not return, so counting them is not
      # available here even if it were wanted. That is the intended shape — the summary is
      # the record, inline is navigation over it.
      #
      # Do NOT set the action's `track_progress: true` to get the checkbox UI. It posts a
      # tracking comment authored by claude BEFORE the review runs, which this filter counts
      # — so a run that then died without reviewing anything would pass. That is precisely
      # the #447/#451 hole, reopened by an input that reads like a display option.
      # Pinned by scripts/test/test-review-silence-guard.py, which executes the jq filter
      # below against fixtures (a prior round's comment must NOT satisfy this round).
      # Accepted consequence: a fork PR, which never receives CLAUDE_CODE_OAUTH_TOKEN, now
      # ends red here rather than green — correct (nothing reviewed it), and this repo has
      # no fork contributors, so it is not worth a branch to soften.
      #
      # KNOWN RED, and do NOT weaken this step to make it go away: any PR that edits THIS
      # file fails here. claude-code-action refuses to run when the review workflow on the
      # PR head differs from the copy on the default branch ("Workflow validation failed …
      # must … have identical content to the version on the repository's default branch")
      # — and it exits SUCCESS while skipping, which is the silent-skip this whole step
      # exists to expose. Measured on PR #463, the one that introduced the step: the action
      # reported success in 4s having reviewed nothing, and this step turned it red. The red
      # is accurate, not a false positive: nothing reviewed that PR, so it must be merged on
      # the other checks plus a human/local review. Once merged, head and default match again
      # and the next PR reviews normally.
      - name: Verify a review comment was posted (no silent pass)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.review_start.outputs.at }}
        run: |
          # An empty SINCE is not a harmless default: jq's `>` is true against "" for every
          # timestamp, so the filter would silently widen to "any claude comment ever" — the
          # exact shape this guard exists to reject. `echo "at=$(date ...)"` exits 0 even when
          # date fails (GNU-only `-d` on a non-GNU runner), so the emptiness is checked here.
          if [ -z "$SINCE" ]; then
            echo "::error::review start timestamp missing — the comment count cannot be scoped to this round."
            exit 1
          fi
          count=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.author.login | test("claude"; "i")) | select(.createdAt > env.SINCE)] | length')
          echo "Claude review comments on PR #$PR since $SINCE: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::No Claude review comment posted on PR #$PR since $SINCE — the review produced nothing, which is not the same as finding nothing."
            exit 1
          fi

