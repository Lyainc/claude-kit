# build-spec extensions
spec_version: 1
created: 2026-08-09
target: thinking-tools 사고 산출물을 vault 경위/이력 recall 경로에 잇는 배선
domain: tech
brownfield: true
refine_generation: 0

goal:
  statement: >-
    thinking-tools가 만드는 사고 산출물(expert-panel SUMMARY·UNRESOLVED,
    adversarial-review 결과, unknown-discovery 리포트)을 세션 종료 시 vault
    `wiki/`에 `type: discussion` 페이지로 남겨, 나중에 "전에 이거 어떻게 했지"
    같은 경위/이력 질문에서 vault-searcher가 결론과 함께 기각된 대안까지 꺼내오게 한다.
  clarity_score: 0.90

constraints:
  - id: c1
    type: technical
    description: >-
      목적지는 `~/vault/wiki/`, 프론트매터 `type: discussion`. `notes/`·`sources/`는 불가.
    hard: true
    rationale: >-
      #481(closed)이 볼트 폴더를 저작 주체로 3분할했다 — sources/(외부 원문, 불변),
      notes/(내가 쓴 것), wiki/(AI 컴파일). 사고 산출물은 AI 컴파일이므로 wiki/가 유일한 정합 위치다.
      부수 효과 두 가지가 이 선택을 뒷받침한다: audit E10은 `EXPECTED_FOLDER`에 없는 type이면
      skip하므로 위반이 안 나고, E12a 노화 린트는 `parts[0]=="wiki" and fm.type=="wiki"`만
      대상으로 삼아 `type: discussion`을 자동 제외한다 — 히스토리는 시점에 얼어붙어 있는 게 정상이라 이게 맞다.

  - id: c2
    type: technical
    description: >-
      파일명은 날짜 접두어 없는 kebab 슬러그. 날짜는 프론트매터에만 둔다.
    hard: true
    rationale: >-
      `vault-bridge/hooks/pre-write-guard.sh` L388-389가 wiki/를 "evergreen kebab slugs,
      no date prefix"로 강제한다. 날짜 파일명은 sources/의 capture|session에만 허용된다(L368-372).
      notes/도 bare `YYYY-MM-` 접두어를 금지한다(#531). 즉 "날짜+주제명" 파일명은 세 폴더 모두에서 막힌다.

  - id: c3
    type: technical
    description: >-
      새 스킬·새 슬래시 커맨드·새 진입점을 만들지 않는다. `/wrap`(local-harness)에
      네 번째 스텝을 얹어 기존 `/vault-save`를 호출한다.
    hard: true
    rationale: >-
      owner 제약(직접 발화): "vault-save로 하게 되면 세션 작업과정에서 유저가 명시적으로
      불러야하는 스킬이나 툴이 너무 많아져." 개별 스킬은 전부 v4 §9.1의 "이산 게이트"로
      정당화됐지만 명시 호출 표면의 **총량**(~20개)을 잰 적이 없다. `/wrap`은 스스로를
      "thin sequencer, not a new engine"으로 정의하므로 한 칸 추가의 호출 부담 증가가 0이다.

  - id: c4
    type: technical
    description: >-
      원문 transcripts는 vault에 넣지 않는다. 대신 요약에 기각된 대안과 그때의 전제를 담는다.
    hard: true
    rationale: >-
      로컬 사고 산출물 114K 중 transcripts가 56K(49%)인데 owner 수요에 없다(저장량 절반 감소).
      다만 되찾는 목적이 "근거가 지금도 유효한지 재검토" + "그때 뭘 몰랐는지 확인"이라,
      결론 한 줄로는 성립하지 않는다 — 기각 사유와 당시 전제가 요약 단계에서 살아남아야 한다.

  - id: c5
    type: technical
    description: >-
      naive dump 금지. v5 프론트매터 스키마 준수 + `provenance:` 필수 + 관련 wiki 페이지 wikilink.
    hard: true
    rationale: >-
      owner가 "폴더 하나 만들고 다 때려넣고 grep" 안을 네 가지 이유로 기각했다 —
      "dump하고 다를게 없음 + vault 구조와 호환이 되지 않음 + 지식베이스와 연계하기 어려움 +
      데이터가 많이쌓이면 감당되지 않음(지속가능성)". 앞 셋은 스키마·wikilink가, 넷째는 c7이 받는다.

  - id: c6
    type: technical
    description: >-
      `vault-searcher`의 Question-Type Routing(#519)에 `type: discussion`을 경위/이력 티어로
      올리는 절을 추가한다. 이것이 유일한 인출측 코드 변경이다.
    hard: true
    rationale: >-
      #519는 경위/이력 질문을 `notes/`+`sources/` 1순위, `wiki/` fallback으로 라우팅한다.
      히스토리를 wiki/에 두면 정작 그것을 찾는 질문 유형에서 fallback 층에 놓인다.
      owner의 판단 기준("Wiki가 지식이라면 히스토리는 역사다. '그래서 이게 뭐야?'라고 하면
      지식이 먼저 나오는 게 합리적")과 정합하려면 폴더가 아니라 `type:`이 티어 키가 돼야 한다.

  - id: c7
    type: other
    description: >-
      지속가능성 — 축적 속도 주당 약 1건(8주에 7주제 실측), 3년이면 약 135개로 현재 wiki 45개의 3배.
      recall 후보에서 히스토리가 다수가 돼도 정의/사실 질문의 정확도가 내려가지 않아야 한다.
    hard: false
    rationale: >-
      owner 판정: 오래된 것 자동 감등이나 주기적 솎아내기가 아니라 "recall에서 후순위로 밀기"로 대응.
      c6의 티어 분리가 그 메커니즘 자체다.

  - id: c8
    type: technical
    description: >-
      대상 산출물은 네 종 전부 — expert-panel SUMMARY, expert-panel UNRESOLVED,
      adversarial-review 결과, unknown-discovery 리포트. 써넣는 범위는 레포 무관(어느 레포에서 나오든).
    hard: true
    rationale: >-
      UNRESOLVED가 포함되는 이유는 되찾는 목적 중 하나가 "그때 뭘 몰랐는지 보려고"이기 때문이다
      (현재 15K가 쌓여 있고 아무도 안 본다). 레포 무관인 이유는 vault가 전역 레이어이고,
      실제 갭 중 하나가 "다른 레포에서 작업할 때 안 보인다"이기 때문이다.

  - id: c9
    type: technical
    description: >-
      신규 페이지는 manifest에 반영돼야 한다.
    hard: true
    rationale: >-
      #523(closed) 전례 — manifest가 Read 2,000줄 상한에 잘리면서 wiki 39개 전량이
      recall 후보에서 조용히 사라졌다. 파일을 쓰는 것과 recall 후보에 오르는 것은 별개다.

success_criteria:
  - id: ac1
    description: >-
      새 세션에서 힌트 없이 평범한 경위/이력 질문을 던졌을 때, 그 논의 페이지가 답변에 실제로 반영된다.
    verifiable: true
    measurable_via: >-
      owner가 새 세션을 열어 직접 질문하고 답변 내용을 눈으로 확인. 페이지 존재나 후보 진입이 아니라
      **답변에 반영됐는지**가 판정 기준 — #523이 "후보에서 사라졌는데 아무도 몰랐던" 반대 사례다.
      이 기준은 발견 "기억이 색인 역할을 한다"(검색어가 결국 기억에서 나온다)를 직접 반증하는 자리다.

  - id: ac2
    description: >-
      claude-kit 밖에서 같은 질문을 돌려도 나온다.
    verifiable: true
    measurable_via: >-
      `~/vault` 레포에서 새 세션을 열어 ac1과 같은 질문을 던진다. claude-kit 코드가 전혀 없는
      자리라 로컬 `docs/`로는 절대 답할 수 없고, vault 경로만이 답할 수 있는 유일한 장면이다.

  - id: ac3
    description: >-
      답에 결론뿐 아니라 기각된 대안이 같이 나온다.
    verifiable: true
    measurable_via: >-
      ac1과 같은 확인에서, 답변이 결론 외에 "무엇을 왜 기각했는지"를 포함하는지 본다.
      c4(요약을 두툼하게)가 실제로 먹혔는지를 재는 유일한 기준이다.

  - id: ac4
    description: >-
      로컬 사고 산출물 18건(2026-06-10~08-02)이 소급 이관돼 있다.
    verifiable: true
    measurable_via: >-
      `~/vault/wiki/`에서 `type: discussion` 페이지 수를 센다. ac1~ac3이 전부 "검색해서 나오나"라
      볼트에 내용이 없으면 검증 자체가 불가능하다 — 이관은 별도 작업이 아니라 구동확인의 전제다.

