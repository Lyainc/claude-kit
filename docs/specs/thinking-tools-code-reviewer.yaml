blindspots:
  - area: scoring-authority
    question: >-
      채점 기준이 될 Seed를 누가 고르는가, 그리고 대화에서만 바뀐 결정 때문에 Seed가
      낡아 있을 때 그로 인한 요구 갭 판단을 재확인하는 경로는 무엇인가?
    note: >-
      현재 채점은 호출자가 명시한 요구 출처·base/range와 metadata에서 확인한 현재 승인 범위를
      먼저 확립한다. 낡은 Seed와 대화 결정의 충돌은 메인이 확인하고 build-spec 소유의
      변경 절차로 해결한다. 리뷰어가 역사적 Seed를 활성화하거나 승인·철회를 만들어내지 않는다.

